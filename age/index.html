<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>年龄计算 · 生日到今天的周岁、天数、下次生日</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .panes{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:860px){ .panes{grid-template-columns:330px 1fr; align-items:start} }
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .bd{padding:13px}
  .f{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
  .f label{font-size:12px; color:var(--dim)}
  .f input{
    font:13.5px/1.5 ui-monospace,Menlo,Consolas,monospace; padding:9px 11px; border-radius:8px;
    border:1px solid var(--line); background:var(--card); color:var(--fg); width:100%; min-width:0;
    -webkit-appearance:none; appearance:none;
  }
  .f input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .big{padding:16px 15px 14px; border-bottom:1px solid var(--line)}
  .big .lead{font-size:12px; color:var(--dim); margin-bottom:6px}
  .big .num{font-size:30px; font-weight:600; line-height:1.25; letter-spacing:-.3px}
  .big .num em{font-style:normal; color:var(--accent)}
  .big .sub{font-size:12.5px; color:var(--dim); margin-top:7px; line-height:1.7}
  .cards{display:grid; gap:10px; grid-template-columns:1fr 1fr; padding:13px}
  @media (min-width:620px){ .cards{grid-template-columns:1fr 1fr 1fr} }
  .c{background:var(--soft); border-radius:10px; padding:11px 12px}
  .c .k{font-size:11.5px; color:var(--dim); margin-bottom:5px}
  .c .v{font-size:17px; font-weight:600; line-height:1.3; word-break:break-word}
  .c .v small{font-size:12px; font-weight:400; color:var(--dim); margin-left:3px}
  .c .n{font-size:11px; color:var(--dim); margin-top:4px; line-height:1.5}
  .err{font-size:12px; color:var(--err); min-height:16px; margin-top:8px}
  .seg{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:0 13px 13px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>年龄计算</h1>
      <p class="lede">填一个生日：精确到年月日的周岁、活了多少天、下次生日还有几天，一次算清。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="panes">
    <div class="box">
      <div class="hd"><span>生日</span><span id="state">示例</span></div>
      <div class="bd">
        <div class="f">
          <label>出生日期</label>
          <input type="date" id="birth" value="1996-08-14">
        </div>
        <div class="f">
          <label>算到哪天（默认今天，可以填未来日期做倒推）</label>
          <input type="date" id="to">
        </div>
        <div class="err" id="err"></div>
        <div class="seg" style="padding:0">
          <button class="chip" id="bToday" type="button">用今天</button>
          <button class="chip" id="bCopy" type="button">复制成一句话</button>
        </div>
      </div>
    </div>

    <div class="box">
      <div class="big">
        <div class="lead">周岁</div>
        <div class="num" id="main">—</div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="cards" id="cards"></div>
    </div>
  </div>

  <p class="hint">
    <b>周岁</b>按公历算：满一年才算一岁，月份和天数按日历推，遇到月末会自动按当月实际天数对齐。<br>
    <b>虚岁</b>是老算法：出生就算 1 岁，过了春节再加 1 岁，所以通常比周岁大 1–2 岁。<br>
    <b>生肖</b>这里按公历年份算，1 月到春节前出生的人实际属上一年，介意的话按春节当天自己判断。
  </p>

  <footer>纯本地计算，生日不离开浏览器。</footer>
</div>
<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var ZODIAC = ['鼠', '牛', '虎', '兔', '龙', '蛇', '马', '羊', '猴', '鸡', '狗', '猪'];
  // [起始月, 起始日, 星座]：该日起进入该星座
  var SIGNS = [
    [1, 20, '水瓶座'], [2, 19, '双鱼座'], [3, 21, '白羊座'], [4, 20, '金牛座'],
    [5, 21, '双子座'], [6, 22, '巨蟹座'], [7, 23, '狮子座'], [8, 23, '处女座'],
    [9, 23, '天秤座'], [10, 24, '天蝎座'], [11, 23, '射手座'], [12, 22, '摩羯座']
  ];

  function parseDate(v){
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(v || ''));
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    if (d.getFullYear() !== +m[1] || d.getMonth() !== +m[2] - 1 || d.getDate() !== +m[3]) return null;
    d.setHours(0, 0, 0, 0);
    return d;
  }
  function pad2(n){ return (n < 10 ? '0' : '') + n; }
  function todayStr(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function dayNum(d){ return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000); }
  function fmt(d){
    return d.getFullYear() + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日';
  }
  function daysIn(y, m){ return new Date(y, m + 1, 0).getDate(); }

  function ymd(b, n){
    var d = n.getDate() - b.getDate();
    var m = n.getMonth() - b.getMonth();
    var y = n.getFullYear() - b.getFullYear();
    if (d < 0){
      m--;
      d += daysIn(n.getFullYear(), (n.getMonth() + 11) % 12);
    }
    if (m < 0){ y--; m += 12; }
    return { y: y, m: m, d: d };
  }

  function sign(mo, da){
    for (var i = SIGNS.length - 1; i >= 0; i--){
      if (mo > SIGNS[i][0] || (mo === SIGNS[i][0] && da >= SIGNS[i][1])) return SIGNS[i][2];
    }
    return '摩羯座';
  }

  function card(k, v, unit, note){
    return '<div class="c"><div class="k">' + k + '</div><div class="v">' + v +
      (unit ? '<small>' + unit + '</small>' : '') + '</div>' +
      (note ? '<div class="n">' + note + '</div>' : '') + '</div>';
  }

  function run(){
    var b = parseDate($('birth').value);
    var n = parseDate($('to').value) || parseDate(todayStr());
    var err = $('err');
    if (!b){ err.textContent = '出生日期没填对，选一个日期'; $('main').textContent = '—'; $('cards').innerHTML = ''; return; }
    if (n < b){ err.textContent = '「算到哪天」比生日还早，换一下'; $('main').textContent = '—'; $('cards').innerHTML = ''; return; }
    err.textContent = '';

    var a = ymd(b, n);
    var total = dayNum(n) - dayNum(b);

    if (a.y < 1 && a.m < 24){
      $('main').innerHTML = '<em>' + a.m + '</em> 个月 <em>' + a.d + '</em> 天';
    } else {
      $('main').innerHTML = '<em>' + a.y + '</em> 岁 ' + a.m + ' 个月 ' + a.d + ' 天';
    }

    var next = new Date(n.getFullYear(), b.getMonth(), b.getDate());
    next.setHours(0, 0, 0, 0);
    if (next.getTime() <= n.getTime()) next = new Date(n.getFullYear() + 1, b.getMonth(), b.getDate());
    var toNext = Math.round((next - n) / 86400000);
    var thisYearBirthday = new Date(n.getFullYear(), b.getMonth(), b.getDate());
    var passed = thisYearBirthday.getTime() <= n.getTime();

    // 下一个整千天
    var milestone = Math.ceil((total + 1) / 1000) * 1000;
    var mDate = new Date(b.getTime() + milestone * 86400000);
    var mLeft = milestone - total;

    var z = ZODIAC[((b.getFullYear() - 1900) % 12 + 12) % 12];

    $('sub').textContent = '生于 ' + fmt(b) + '；算到 ' + fmt(n) + '。' +
      (passed ? '今年的生日已经过了。' : '今年生日还有 ' + Math.round((thisYearBirthday - n) / 86400000) + ' 天。');

    var nextAge = a.y + 1;
    $('cards').innerHTML =
      card('虚岁（按公历年份）', (a.y + 1), '岁', '春节前后可能差 1 岁') +
      card('生肖', z, '', '按公历年份，非春节分界') +
      card('星座', sign(b.getMonth() + 1, b.getDate()), '', '') +
      card('活了多少天', total.toLocaleString('zh-CN'), '天', '约 ' + Math.floor(total / 7).toLocaleString('zh-CN') + ' 周') +
      card('活了多少小时', Math.round(total * 24).toLocaleString('zh-CN'), '小时', '约 ' + (total / 365.25).toFixed(2) + ' 个公历年') +
      card('下次生日', toNext, '天后', fmt(next) + '，满 ' + nextAge + ' 岁') +
      card('第 ' + milestone.toLocaleString('zh-CN') + ' 天', mLeft, '天后', fmt(mDate));
    $('state').textContent = '已算';
  }

  var copyPhrase = function(){
    var b = parseDate($('birth').value), n = parseDate($('to').value) || parseDate(todayStr());
    if (!b || n < b) return;
    var a = ymd(b, n);
    var t = fmt(b) + '出生，到' + fmt(n) + '是 ' + a.y + ' 周岁 ' + a.m + ' 个月 ' + a.d + ' 天';
    if (typeof copyText === 'function') copyText(t);
    $('state').textContent = '已复制';
    setTimeout(function(){ $('state').textContent = '已算'; }, 1500);
  };

  $('birth').addEventListener('input', run);
  $('to').addEventListener('input', run);
  $('bToday').addEventListener('click', function(){ $('to').value = ''; run(); });
  $('bCopy').addEventListener('click', copyPhrase);

  $('to').value = '';
  run();
})();
</script>

.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
