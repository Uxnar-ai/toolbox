<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>网段计算 · 贴一个 IP 或 CIDR，算出网络地址、广播、可用范围</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .entry{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px}
  .entry .lbl2{font-size:12.5px; color:var(--dim); margin-bottom:7px}
  #q{
    width:100%; font:16px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:11px 13px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg); color:var(--fg); letter-spacing:.3px;
  }
  #q:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .quick{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .quick s{text-decoration:none; font-size:12px; color:var(--dim); margin-right:2px}
  .cells{
    display:grid; grid-template-columns:1fr 1fr; gap:1px;
    background:var(--line); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden;
  }
  @media (min-width:760px){ .cells{grid-template-columns:repeat(4,1fr)} }
  .cell{background:var(--card); padding:11px 13px; min-width:0}
  .cell i{display:block; font-style:normal; font-size:11.5px; color:var(--dim); margin-bottom:4px}
  .cell b{font:600 14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all; display:block}
  .cell.hi b{color:var(--accent)}
  .cell.sm b{font-size:13px}
  .sub{margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .sub h2{
    margin:0; padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim);
    background:var(--soft); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;
  }
  .sub .bd{padding:12px 13px}
  .sub table{width:100%; border-collapse:collapse; font-size:12.5px}
  .sub th{text-align:left; font-weight:500; color:var(--dim); font-size:11.5px; padding:0 8px 7px 0; border-bottom:1px solid var(--line)}
  .sub td{padding:7px 8px 7px 0; border-bottom:1px solid var(--line); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all}
  .sub tr:last-child td{border-bottom:0}
  .sub td.n{color:var(--dim); width:34px}
  .sub .empty{padding:4px 0; font-size:12.5px; color:var(--dim)}
  .chk{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .chk input{
    flex:1 1 190px; min-width:0; font:14px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg);
  }
  .chk input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .verdict{font-size:13px; margin-top:10px; color:var(--dim)}
  .verdict b{color:var(--fg)}
  .verdict.ok2 b{color:var(--ok)}
  .verdict.no b{color:var(--err)}
  .mini{font-size:11.5px; color:var(--dim); margin:9px 0 0; line-height:1.7}
  .splits{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:10px}
  .splits input{width:74px; font:inherit; font-size:13.5px; padding:6px 9px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>网段计算</h1>
      <p class="lede">贴一个 IP 或网段（带 /24 或掩码），立刻算出网络地址、广播地址、可用主机范围和能放多少台机器。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="entry">
    <div class="lbl2">IP 或网段，例：203.0.113.37/26、203.0.113.0 255.255.255.0</div>
    <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="粘贴 IP 或 CIDR…">
    <div class="quick">
      <s>常用位数：</s>
      <button class="chip" type="button" data-bits="8">/8</button>
      <button class="chip" type="button" data-bits="16">/16</button>
      <button class="chip" type="button" data-bits="24">/24</button>
      <button class="chip" type="button" data-bits="28">/28</button>
      <button class="chip" type="button" data-bits="30">/30</button>
      <button class="chip" type="button" data-bits="32">/32</button>
    </div>
  </div>

  <div id="err" class="err"></div>

  <div class="cells" id="cells"></div>
  <p class="mini" id="hint">位数为网络前缀长度：/24 表示前 24 位是网络号，剩 8 位给主机。</p>

  <div class="sub">
    <h2><span>切成几个小网段</span><span style="font-weight:400">每个子网的地址范围</span></h2>
    <div class="bd">
      <div class="splits">
        <span style="font-size:12.5px;color:var(--dim)">想要</span>
        <input id="nsub" type="number" min="2" max="4096" step="1" value="4">
        <span style="font-size:12.5px;color:var(--dim)">个子网</span>
        <span id="subInfo" style="font-size:12.5px;color:var(--dim)"></span>
      </div>
      <div id="subBody"></div>
    </div>
  </div>

  <div class="sub">
    <h2><span>查另一个 IP 在不在这个网段里</span><span style="font-weight:400">只需填 IP</span></h2>
    <div class="bd">
      <div class="chk">
        <input id="probe" type="text" spellcheck="false" autocomplete="off" placeholder="例如 203.0.113.70">
        <button class="chip quick" type="button" id="bCopyMask">复制掩码</button>
      </div>
      <div class="verdict" id="verdict">填一个 IP，马上告诉你它在不在上面这个网段。</div>
    </div>
  </div>

  <footer>全部在浏览器里算，地址不会发到服务器。示例用的是文档专用地址段 203.0.113.0/24，不对应任何真实主机。</footer>
</div>
<script src="../assets/base.js"></script>
<script>
(function(){
  var q = document.getElementById('q');
  var cells = document.getElementById('cells');
  var err = document.getElementById('err');
  var hint = document.getElementById('hint');
  var nsub = document.getElementById('nsub');
  var subInfo = document.getElementById('subInfo');
  var subBody = document.getElementById('subBody');
  var probe = document.getElementById('probe');
  var verdict = document.getElementById('verdict');

  var SAMPLE = '203.0.113.37/26';

  function ip2n(s){
    var p = String(s).trim().split('.');
    if (p.length !== 4) return null;
    var n = 0;
    for (var i = 0; i < 4; i++){
      if (!/^\d{1,3}$/.test(p[i])) return null;
      var v = +p[i];
      if (v > 255) return null;
      n = n * 256 + v;
    }
    return n;
  }
  function n2ip(n){
    return [(n >>> 24) & 255, (n >>> 16) & 255, (n >>> 8) & 255, n & 255].join('.');
  }

  var state = null;

  function classify(n){
    var a = (n >>> 24) & 255, b = (n >>> 16) & 255;
    if (a === 10) return '私有地址';
    if (a === 172 && b >= 16 && b <= 31) return '私有地址';
    if (a === 192 && b === 168) return '私有地址';
    if (a === 127) return '本机回环';
    if (a === 169 && b === 254) return '链路本地';
    if (a === 100 && b >= 64 && b <= 127) return '运营商大内网';
    if (a >= 224 && a <= 239) return '组播';
    if (a >= 240) return '保留';
    if (a === 0) return '保留';
    if (a === 203 && b === 0 && ((n >>> 8) & 255) === 113) return '文档示例段';
    return '公网地址';
  }

  function parse(raw){
    var t = raw.trim();
    if (!t) return null;
    var m = t.match(/^(\d{1,3}(?:\.\d{1,3}){3})(?:\s*\/\s*(\d{1,2})|\s+(\d{1,3}(?:\.\d{1,3}){3}))?$/);
    if (!m) return {err: '看不出是 IP 或网段。写法：203.0.113.37/26 或 203.0.113.0 255.255.255.0'};
    var ipn = ip2n(m[1]);
    if (ipn === null) return {err: 'IP 每段要在 0–255 之间，检查一下 ' + m[1]};
    var bits = 32;
    if (m[2] !== undefined){
      bits = +m[2];
      if (bits < 0 || bits > 32) return {err: '斜杠后面是 0–32 的位数，不是 ' + m[2]};
    } else if (m[3] !== undefined){
      var mn = ip2n(m[3]);
      if (mn === null) return {err: '掩码每段要在 0–255 之间'};
      var inv = (~mn) >>> 0;
      if ((inv & (inv + 1)) !== 0) return {err: '掩码得是连续的一串 1，像 255.255.255.0 这样；' + m[3] + ' 不连续'};
      bits = 0;
      var x = mn;
      while (x){ bits += x & 1; x = x >>> 1; }
      bits = 32 - inv.toString(2).length;
      if (bits < 0) bits = 0;
      // 上面这行只为兜底，下面按 popcount 重算更稳
      bits = 0; x = mn;
      for (var i = 0; i < 32; i++){ if ((mn >>> i) & 1) bits++; }
    }
    var mask = bits === 0 ? 0 : (0xFFFFFFFF << (32 - bits)) >>> 0;
    var net = (ipn & mask) >>> 0;
    var bcast = (net | ((~mask) >>> 0)) >>> 0;
    return {ipn: ipn, bits: bits, mask: mask, net: net, bcast: bcast};
  }

  function cell(label, value, cls){
    return '<div class="cell' + (cls ? ' ' + cls : '') + '"><i>' + label + '</i><b>' + value + '</b></div>';
  }

  function paint(){
    var raw = q.value;
    err.className = 'err';
    if (!raw.trim()){
      state = null;
      cells.innerHTML = cell('等一个地址', '贴上来就开算', 'sm');
      subBody.innerHTML = '<div class="empty">先在上面填一个网段。</div>';
      subInfo.textContent = '';
      hint.textContent = '位数为网络前缀长度：/24 表示前 24 位是网络号，剩 8 位给主机。';
      paintProbe();
      return;
    }
    var r = parse(raw);
    if (!r || r.err){
      err.textContent = r ? r.err : '';
      err.className = 'err on';
      return;
    }
    state = r;
    var total = Math.pow(2, 32 - r.bits);
    var usable, range;
    if (r.bits >= 31){
      // /31 点对点两个地址都能用；/32 单个地址
      usable = total;
      range = total === 2 ? n2ip(r.net) + ' – ' + n2ip(r.bcast) : n2ip(r.net);
    } else {
      usable = total - 2;
      range = n2ip((r.net + 1) >>> 0) + ' – ' + n2ip((r.bcast - 1) >>> 0);
    }
    cells.innerHTML =
      cell('网络地址', n2ip(r.net), 'hi') +
      cell('广播地址', n2ip(r.bcast)) +
      cell('可用范围', range, 'sm') +
      cell('可用主机', usable.toLocaleString() + ' 台') +
      cell('子网掩码', n2ip(r.mask)) +
      cell('反掩码', n2ip((~r.mask) >>> 0)) +
      cell('前缀长度', '/' + r.bits + '（' + (32 - r.bits) + ' 位给主机）', 'sm') +
      cell('地址类型', classify(r.net), 'sm');
    hint.textContent = r.bits >= 31
      ? '这个长度下没有「去掉网络号和广播」的说法，地址全部可用。'
      : '可用主机 = 总地址 ' + total.toLocaleString() + ' − 网络地址 − 广播地址。';
    paintSub();
    paintProbe();
  }

  function paintSub(){
    if (!state){ subInfo.textContent = ''; return; }
    var want = parseInt(nsub.value, 10);
    if (!want || want < 2){ subInfo.textContent = '至少切 2 个'; subBody.innerHTML = ''; return; }
    var add = Math.ceil(Math.log(want) / Math.log(2));
    var newBits = state.bits + add;
    if (newBits > 32){
      subInfo.textContent = '这个网段最多切 ' + Math.pow(2, 32 - state.bits) + ' 个，装不下 ' + want + ' 个';
      subBody.innerHTML = '';
      return;
    }
    var count = Math.pow(2, add);
    subInfo.textContent = '正好 ' + count + ' 个，每个 /' + newBits;
    var step = Math.pow(2, 32 - newBits);
    var show = Math.min(count, 8);
    var rows = '';
    for (var i = 0; i < show; i++){
      var s = (state.net + i * step) >>> 0;
      var e = (s + step - 1) >>> 0;
      var lo = newBits >= 31 ? s : (s + 1) >>> 0;
      var hi = newBits >= 31 ? e : (e - 1) >>> 0;
      rows += '<tr><td class="n">' + (i + 1) + '</td><td>' + n2ip(s) + '/' + newBits +
              '</td><td>' + n2ip(lo) + ' – ' + n2ip(hi) + '</td></tr>';
    }
    subBody.innerHTML = '<table><thead><tr><th class="n">#</th><th>网段</th><th>可用范围</th></tr></thead><tbody>' +
      rows + '</tbody></table>' +
      (count > show ? '<p class="mini">只列前 ' + show + ' 个，共 ' + count + ' 个。</p>' : '');
  }

  function paintProbe(){
    var t = probe.value.trim();
    if (!t){
      verdict.className = 'verdict';
      verdict.textContent = '填一个 IP，马上告诉你它在不在上面这个网段。';
      return;
    }
    var n = ip2n(t);
    if (n === null){
      verdict.className = 'verdict';
      verdict.innerHTML = '这不是一个完整 IP，四段都要填，每段 0–255。';
      return;
    }
    if (!state){
      verdict.className = 'verdict';
      verdict.textContent = '先在上面填一个网段。';
      return;
    }
    var inside = ((n & state.mask) >>> 0) === state.net;
    verdict.className = 'verdict ' + (inside ? 'ok2' : 'no');
    verdict.innerHTML = inside
      ? '<b>' + n2ip(n) + '</b> 在这个网段里，' + ((n >>> 0) === state.net ? '而且它就是网络地址' : ((n >>> 0) === state.bcast ? '而且它是广播地址，别分配给机器' : '可以直接分配给机器')) + '。'
      : '<b>' + n2ip(n) + '</b> 不在这个网段里，它属于 ' + n2ip((n & state.mask) >>> 0) + '/' + state.bits + '。';
  }

  q.addEventListener('input', paint);
  nsub.addEventListener('input', paintSub);
  probe.addEventListener('input', paintProbe);

  [].forEach.call(document.querySelectorAll('[data-bits]'), function(b){
    b.addEventListener('click', function(){
      var m = q.value.trim().match(/^\d{1,3}(?:\.\d{1,3}){3}/);
      if (!m) return;
      q.value = m[0] + '/' + b.getAttribute('data-bits');
      paint();
    });
  });

  document.getElementById('bCopyMask').addEventListener('click', function(){
    if (!state){ return; }
    copyText(n2ip(state.mask) + '（/' + state.bits + '）', this, '复制掩码');
  });

  q.value = SAMPLE;
  probe.value = '203.0.113.70';
  paint();
})();
</script>

<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
