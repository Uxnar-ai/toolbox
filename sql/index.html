<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQL 排版 · 粘一段 SQL，自动断行缩进、关键字大写</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .panes{align-items:start}
  .pane textarea{height:400px}
  .pane pre.out{height:400px; tab-size:2}
  .pane h2 .hint{font-weight:400; font-size:11.5px; color:var(--dim)}
  .bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:12px}
  .bar .grow{flex:1 1 auto}
  .bar select{width:auto}
  .toggle2{
    font:inherit; font-size:12.5px; padding:6px 11px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--dim);
  }
  .toggle2.on{background:var(--accent); color:var(--accent-fg); border-color:transparent}
  .stats{margin-top:10px}
  .warn{margin-top:8px; font-size:12.5px; color:var(--warn); display:none}
  .warn.on{display:block}
  @media (max-width:560px){
    .pane textarea, .pane pre.out{height:260px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>SQL 排版</h1>
      <p class="lede">粘一段挤成一团的 SQL：子句换行、字段一行一个、关键字大写。或者反过来，压成一行。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="bar">
    <button class="chip on" type="button" id="mFmt">排版</button>
    <button class="chip" type="button" id="mMin">压成一行</button>
    <button class="chip" type="button" id="bCopy">复制结果</button>
    <button class="chip" type="button" id="bSample">示例</button>
    <button class="chip" type="button" id="bClear">清空</button>
    <span class="grow"></span>
    <button class="toggle2 on" type="button" id="bUpper">关键字大写</button>
    <select id="ind" title="缩进">
      <option value="2">缩进 2 格</option>
      <option value="4">缩进 4 格</option>
      <option value="0">不缩进</option>
    </select>
  </div>

  <div class="panes">
    <div class="pane">
      <h2>原始 SQL <span class="hint">粘进来就开始排</span></h2>
      <textarea id="src" spellcheck="false" autocomplete="off" placeholder="select ..."></textarea>
    </div>
    <div class="pane">
      <h2>排好的 <span class="hint" id="mode">子句换行 · 列表一列一行</span></h2>
      <pre class="out" id="dst"></pre>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="warn" id="warn"></div>

  <footer>
    只改空白，不动语义：字符串、注释、反引号里的内容原样保留。全部在浏览器里算，SQL 不会上传。
  </footer>
</div>
<script src="../assets/base.js"></script>
<script src="../assets/sql/sqlfmt.js"></script>
<script>
(function(){
  var src = document.getElementById('src');
  var dst = document.getElementById('dst');
  var stats = document.getElementById('stats');
  var warn = document.getElementById('warn');
  var ind = document.getElementById('ind');
  var mode = 'fmt';
  var upper = true;
  var timer = null;

  var SAMPLE = "select u.id,u.name,count(o.id) as orders,sum(o.total) as amount from users u left join orders o on o.user_id=u.id and o.status='paid' where u.created_at>='2026-01-01' and u.city in ('杭州','成都') group by u.id,u.name having sum(o.total)>500 order by amount desc limit 20;";

  function countStmt(s){
    var n = 0, inStr = false, q = '';
    for (var i = 0; i < s.length; i++){
      var c = s.charAt(i);
      if (inStr){ if (c === q) inStr = false; continue; }
      if (c === "'" || c === '"' || c === '`'){ inStr = true; q = c; continue; }
      if (c === ';') n++;
    }
    return n;
  }

  function run(){
    var text = src.value;
    if (!text.trim()){ dst.textContent = ''; stats.innerHTML = ''; warn.className = 'warn'; return; }
    var out = '';
    try {
      out = mode === 'fmt'
        ? SqlFmt.fmt(text, {upper: upper, indent: parseInt(ind.value, 10)})
        : SqlFmt.minify(text);
    } catch (e){
      warn.textContent = '这段排不动：' + e.message;
      warn.className = 'warn on';
      return;
    }
    dst.textContent = out;

    // 括号不配对时提示一句（排版照样出，只是提醒）
    var o = (text.match(/\(/g) || []).length, c = (text.match(/\)/g) || []).length;
    if (o !== c){
      warn.textContent = '括号好像没配对：' + o + ' 个左括号、' + c + ' 个右括号。';
      warn.className = 'warn on';
    } else {
      warn.className = 'warn';
    }

    var inLines = text.split('\n').length, outLines = out.split('\n').length;
    stats.innerHTML =
      '语句 <b>' + countStmt(text) + '</b>' +
      '　输入 <b>' + inLines + '</b> 行 / ' + text.length + ' 字' +
      '　输出 <b>' + outLines + '</b> 行 / ' + out.length + ' 字' +
      '　行数 <b>' + inLines + ' → ' + outLines + '</b>';
  }

  function later(){ clearTimeout(timer); timer = setTimeout(run, 120); }

  src.addEventListener('input', later);
  ind.addEventListener('change', run);

  document.getElementById('bUpper').addEventListener('click', function(){
    upper = !upper; this.className = 'toggle2' + (upper ? ' on' : ''); run();
  });

  document.getElementById('mFmt').addEventListener('click', function(){
    mode = 'fmt'; syncMode(); run();
  });
  document.getElementById('mMin').addEventListener('click', function(){
    mode = 'min'; syncMode(); run();
  });
  function syncMode(){
    document.getElementById('mFmt').className = 'chip' + (mode === 'fmt' ? ' on' : '');
    document.getElementById('mMin').className = 'chip' + (mode === 'min' ? ' on' : '');
    document.getElementById('mode').textContent = mode === 'fmt' ? '子句换行 · 列表一列一行' : '压成一行 · 注释已去掉';
  }

  document.getElementById('bCopy').addEventListener('click', function(){
    copyText(dst.textContent, this, '复制结果');
  });
  document.getElementById('bSample').addEventListener('click', function(){
    src.value = SAMPLE; run();
  });
  document.getElementById('bClear').addEventListener('click', function(){
    src.value = ''; run(); src.focus();
  });

  src.value = SAMPLE;
  run();
})();
</script>

<a class="tb-nav" href="../" title="回到工具台">⌂ 工具台</a>
<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
