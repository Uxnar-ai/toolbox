<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>截图美化 · 加个背景和圆角，直接能发</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; margin-bottom:14px}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .bd{padding:14px}
  .layout{display:grid; gap:18px; grid-template-columns:290px 1fr}
  @media (max-width:820px){ .layout{grid-template-columns:1fr} }
  .drop{display:block; border:2px dashed var(--line); border-radius:12px; padding:16px; text-align:center; cursor:pointer; color:var(--dim); font-size:13px; line-height:1.8; transition:border-color .15s, background .15s}
  .drop:hover,.drop.hot{border-color:var(--accent); color:var(--accent); background:var(--soft)}
  .drop b{color:var(--fg); font-weight:600}
  .drop input{display:none}
  .grp{margin-top:15px}
  .grp>label{display:block; font-size:12.5px; color:var(--dim); margin-bottom:7px}
  .sw{display:flex; gap:7px; flex-wrap:wrap}
  .sw button{width:34px; height:26px; border-radius:7px; border:2px solid transparent; cursor:pointer; padding:0; outline-offset:2px}
  .sw button.on{border-color:var(--accent); box-shadow:0 0 0 2px var(--card) inset}
  .slide{display:flex; align-items:center; gap:9px}
  .slide input[type=range]{flex:1 1 auto; min-width:0; accent-color:var(--accent)}
  .slide output{font:600 12.5px/1 ui-monospace,Menlo,Consolas,monospace; color:var(--fg); min-width:42px; text-align:right}
  select{font:13px/1.4 inherit; padding:8px 9px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); width:100%}
  .check{display:flex; align-items:center; gap:7px; font-size:13px; cursor:pointer}
  .check input{width:16px; height:16px; accent-color:var(--accent)}
  .stage{background:var(--soft); border-radius:12px; padding:12px; display:flex; align-items:center; justify-content:center; min-height:300px}
  .stage canvas{max-width:100%; max-height:460px; height:auto; display:block; border-radius:8px; box-shadow:0 2px 14px rgba(0,0,0,.10)}
  .actions{display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; align-items:center}
  .btn{font:600 13px/1 inherit; padding:9px 15px; border-radius:9px; border:1px solid transparent; background:var(--accent); color:var(--accent-fg); cursor:pointer}
  .btn.ghost{background:var(--card); color:var(--fg); border-color:var(--line)}
  .btn.ghost:hover{border-color:var(--accent); color:var(--accent)}
  .meta{font-size:12.5px; color:var(--dim); margin-left:auto}
  .tip{margin:0; font-size:12.5px; color:var(--dim); line-height:1.85}
  .tip b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>截图美化</h1>
      <p class="lede">截图直接发太素：加个背景、圆角、淡淡的投影，导出来就能贴进文章和群聊。图不出本机。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="box">
    <div class="hd"><span>拖一张截图进来</span><span id="sizeHint">示例图 1200 × 800</span></div>
    <div class="bd">
      <div class="layout">
        <div>
          <label class="drop" id="drop">
            <b>拖图到这里</b>，或点一下选文件<br>
            <span style="font-size:12px">PNG / JPG / WebP，只在浏览器里处理</span>
            <input type="file" id="file" accept="image/*">
          </label>

          <div class="grp">
            <label>背景</label>
            <div class="sw" id="bgs"></div>
          </div>

          <div class="grp">
            <label>四周留白</label>
            <div class="slide"><input type="range" id="pad" min="0" max="20" value="6" step="1"><output id="padO">6%</output></div>
          </div>

          <div class="grp">
            <label>图片圆角</label>
            <div class="slide"><input type="range" id="rad" min="0" max="48" value="16" step="1"><output id="radO">16</output></div>
          </div>

          <div class="grp">
            <label class="check"><input type="checkbox" id="shadow" checked> 加一层投影，看着浮起来</label>
          </div>

          <div class="grp">
            <label for="ratio">画布比例</label>
            <select id="ratio">
              <option value="0" selected>跟着图片走</option>
              <option value="1">1 : 1（方图）</option>
              <option value="1.3333">4 : 3</option>
              <option value="1.7778">16 : 9（横屏封面）</option>
            </select>
          </div>

          <div class="grp">
            <label for="w">导出宽度</label>
            <select id="w">
              <option value="1200">1200 像素</option>
              <option value="1600" selected>1600 像素</option>
              <option value="2400">2400 像素（高清）</option>
            </select>
          </div>
        </div>

        <div>
          <div class="stage"><canvas id="cv"></canvas></div>
          <div class="actions">
            <button class="btn" id="dl">下载 PNG</button>
            <button class="btn ghost" id="again">换回示例</button>
            <span class="meta" id="meta"></span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <p class="tip">
    <b>什么时候用</b>：写教程放操作截图、做封面图、群里发对比图 —— 纯色背景的截图直接发容易和聊天背景糊在一起。<br>
    <b>比例怎么选</b>：发公众号/小红书用 16:9 或 4:3，头像和封面用 1:1，只想保留原图就选「跟着图片走」。<br>
    <b>导出多大</b>：微信文章 1600 够用，印刷再上 2400；文件太大反而发不出去。
  </p>

  <footer>图片只在本地画布上处理，不上传服务器。</footer>
</div>
<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var src = null;               // 当前图片（Image）
  var SRC_W = 0, SRC_H = 0;

  var BGS = [
    ['蓝紫', '#6a8dff', '#8f5bff'],
    ['暖橙', '#ffb36b', '#ff5f6d'],
    ['青绿', '#3ddc97', '#1d9bf0'],
    ['石墨', '#2b2f36', '#14161a'],
    ['米白', '#f4f2ec', '#e7e3d8'],
    ['深蓝', '#16233f', '#2b4a7d']
  ];
  var bgIdx = 0;

  function roundRect(c, x, y, w, h, r){
    r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
    c.beginPath();
    if (c.roundRect){ c.roundRect(x, y, w, h, r); return; }
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function compose(){
    if (!src) return;
    var padPct = (parseInt($('pad').value, 10) || 0) / 100;
    var radius = parseInt($('rad').value, 10) || 0;
    var ratio = parseFloat($('ratio').value) || 0;
    var targetW = parseInt($('w').value, 10) || 1600;
    var hasShadow = $('shadow').checked;

    var padPx = padPct * Math.min(SRC_W, SRC_H);
    var cw = SRC_W + padPx * 2, ch = SRC_H + padPx * 2;
    if (ratio > 0){
      if (cw / ch > ratio) ch = cw / ratio; else cw = ch * ratio;
    }

    var scale = targetW / cw;
    var W = Math.round(cw * scale), H = Math.round(ch * scale);
    cv.width = W; cv.height = H;

    var bg = BGS[bgIdx];
    var g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, bg[1]); g.addColorStop(1, bg[2]);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var dw = SRC_W * scale, dh = SRC_H * scale;
    var dx = (W - dw) / 2, dy = (H - dh) / 2;
    var r = radius * scale;

    ctx.save();
    if (hasShadow){
      ctx.shadowColor = 'rgba(0,0,0,.30)';
      ctx.shadowBlur = Math.max(8, 26 * scale);
      ctx.shadowOffsetY = Math.max(3, 10 * scale);
    }
    ctx.fillStyle = '#fff';
    roundRect(ctx, dx, dy, dw, dh, r);
    ctx.fill();
    ctx.restore();

    ctx.save();
    roundRect(ctx, dx, dy, dw, dh, r);
    ctx.clip();
    ctx.drawImage(src, dx, dy, dw, dh);
    ctx.restore();

    $('meta').textContent = W + ' × ' + H + ' · ' + bg[0] + ' 背景';
    $('sizeHint').textContent = '原图 ' + SRC_W + ' × ' + SRC_H;
  }

  function makeDemo(){
    // 造一张像截图的示例：白底、标题条、几行文字和一个按钮
    var w = 1200, h = 800;
    var c = document.createElement('canvas');
    c.width = w; c.height = h;
    var x = c.getContext('2d');
    x.fillStyle = '#ffffff'; x.fillRect(0, 0, w, h);
    x.fillStyle = '#f3f4f6'; x.fillRect(0, 0, w, 72);
    ['#ff5f57', '#febc2e', '#28c840'].forEach(function(col, i){
      x.beginPath(); x.arc(34 + i * 26, 36, 8, 0, Math.PI * 2); x.fillStyle = col; x.fill();
    });
    x.fillStyle = '#6b7280'; x.font = '500 20px sans-serif';
    x.fillText('订单详情 · 示例截图', 140, 44);

    x.fillStyle = '#111827'; x.font = '600 34px sans-serif';
    x.fillText('笔记本电脑 · 14 英寸', 64, 150);
    x.fillStyle = '#6b7280'; x.font = '400 22px sans-serif';
    x.fillText('订单号 A20261124001 · 2026-11-24 下单', 64, 190);

    x.strokeStyle = '#e5e7eb'; x.lineWidth = 2;
    x.beginPath(); x.moveTo(64, 230); x.lineTo(w - 64, 230); x.stroke();

    var rows = [['商品金额', '¥4,299.00'], ['优惠券', '-¥300.00'], ['运费', '¥0.00'], ['实付', '¥3,999.00']];
    rows.forEach(function(r, i){
      var y = 290 + i * 64;
      x.fillStyle = i === 3 ? '#111827' : '#6b7280';
      x.font = (i === 3 ? '600 24px' : '400 24px') + ' sans-serif';
      x.fillText(r[0], 64, y);
      x.textAlign = 'right';
      x.fillStyle = i === 3 ? '#dc2626' : '#111827';
      x.fillText(r[1], w - 64, y);
      x.textAlign = 'left';
    });

    x.fillStyle = '#2f6df6';
    x.beginPath();
    if (x.roundRect) x.roundRect(64, 640, 300, 72, 12); else x.rect(64, 640, 300, 72);
    x.fill();
    x.fillStyle = '#fff'; x.font = '600 24px sans-serif';
    x.fillText('查看物流', 154, 686);

    return c;
  }

  function useCanvas(c){
    SRC_W = c.width; SRC_H = c.height;
    src = c;
    compose();
  }

  function useFile(f){
    if (!f || !/^image\//.test(f.type)) return;
    var url = URL.createObjectURL(f);
    var img = new Image();
    img.onload = function(){
      URL.revokeObjectURL(url);
      SRC_W = img.naturalWidth; SRC_H = img.naturalHeight;
      src = img;
      compose();
    };
    img.src = url;
  }

  // 背景色块
  var sw = '';
  BGS.forEach(function(b, i){
    sw += '<button data-i="' + i + '" class="' + (i === bgIdx ? 'on' : '') + '" title="' + b[0]
        + '" style="background:linear-gradient(135deg,' + b[1] + ',' + b[2] + ')"></button>';
  });
  $('bgs').innerHTML = sw;
  $('bgs').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    bgIdx = parseInt(b.getAttribute('data-i'), 10);
    [].forEach.call(this.children, function(x){ x.classList.remove('on'); });
    b.classList.add('on');
    compose();
  });

  $('drop').addEventListener('click', function(e){
    if (e.target.tagName !== 'INPUT') $('file').click();
  });
  $('file').addEventListener('change', function(){ useFile(this.files[0]); });

  ['dragenter', 'dragover'].forEach(function(t){
    $('drop').addEventListener(t, function(e){ e.preventDefault(); this.classList.add('hot'); });
  });
  ['dragleave', 'drop'].forEach(function(t){
    $('drop').addEventListener(t, function(e){ e.preventDefault(); this.classList.remove('hot'); });
  });
  $('drop').addEventListener('drop', function(e){
    if (e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]) useFile(e.dataTransfer.files[0]);
  });

  $('pad').addEventListener('input', function(){ $('padO').textContent = this.value + '%'; compose(); });
  $('rad').addEventListener('input', function(){ $('radO').textContent = this.value; compose(); });
  $('shadow').addEventListener('change', compose);
  $('ratio').addEventListener('change', compose);
  $('w').addEventListener('change', compose);
  $('again').addEventListener('click', function(){ useCanvas(makeDemo()); });

  $('dl').addEventListener('click', function(){
    cv.toBlob(function(b){
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = 'shot-' + Date.now() + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 4000);
    }, 'image/png');
  });

  useCanvas(makeDemo());
})();
</script>

<a class="tb-nav" href="../" title="回到工具台">⌂ 工具台</a>
<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
