<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>号码校验 · 身份证、银行卡、信用代码、条码真伪一眼看</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .entry{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px}
  .lbl2{font-size:12.5px; color:var(--dim); margin-bottom:7px}
  #q{
    width:100%; font:17px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:12px 14px; border:1px solid var(--line); border-radius:9px;
    background:var(--bg); color:var(--fg); letter-spacing:.6px;
  }
  #q:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .quick{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; align-items:center}
  .quick s{text-decoration:none; font-size:12px; color:var(--dim); margin-right:2px}

  .res{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .res h2{
    margin:0; padding:11px 14px; font-size:13.5px; font-weight:600;
    background:var(--soft); border-bottom:1px solid var(--line);
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
  }
  .badge{font-size:12px; font-weight:600; padding:3px 10px; border-radius:999px}
  .badge.ok{background:rgba(31,122,77,.12); color:var(--ok)}
  .badge.bad{background:rgba(192,57,43,.12); color:var(--err)}
  .badge.na{background:var(--soft); color:var(--dim)}
  .res table{width:100%; border-collapse:collapse; font-size:13px}
  .res td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:top}
  .res tr:last-child td{border-bottom:0}
  .res td.k{color:var(--dim); white-space:nowrap; width:150px}
  .res td.v{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; word-break:break-all}
  .res td.v.ok{color:var(--ok)}
  .res td.v.bad{color:var(--err)}
  .empty{padding:26px 14px; color:var(--dim); font-size:13.5px; text-align:center}
  .note{font-size:12px; color:var(--dim); margin-top:10px; line-height:1.75}
  @media (max-width:560px){
    .res td.k{width:96px; font-size:12.5px}
    .res td{padding:8px 11px}
    #q{font-size:15px; letter-spacing:.2px}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>号码校验</h1>
      <p class="lede">身份证、银行卡、统一社会信用代码、商品条码，粘进来立刻判断校验位对不对，顺带把出生日期、性别、卡组织读出来。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="entry">
    <div class="lbl2">粘贴号码，空格和横杠会自动去掉</div>
    <input id="q" type="text" spellcheck="false" autocomplete="off" placeholder="身份证 / 银行卡 / 统一社会信用代码 / 条形码">
    <div class="quick" id="quick">
      <s>试一个：</s>
      <button class="chip" type="button" data-demo="id">身份证</button>
      <button class="chip" type="button" data-demo="card">银行卡</button>
      <button class="chip" type="button" data-demo="uscc">信用代码</button>
      <button class="chip" type="button" data-demo="ean">商品条码</button>
      <button class="chip" type="button" data-demo="isbn">ISBN</button>
    </div>
  </div>

  <div class="res">
    <h2><span id="rtitle">结果</span><span class="badge na" id="rbadge">等你输入</span></h2>
    <div id="rbody"><div class="empty">粘一个号码进来，或者点上面的「试一个」。</div></div>
  </div>

  <div class="note">
    校验位只能说明「这个号码没打错字」，不能证明它真实存在——真要核实还得去发证机关的官方渠道。
    所有计算都在你的浏览器里完成，号码不会上传，也不留在本地。
  </div>

  <footer>
    支持：身份证 15 / 17 / 18 位（17 位和 15 位会自动补成 18 位）、银行卡 12–19 位（Luhn）、统一社会信用代码 18 位、EAN-13 条码、ISBN-10。
  </footer>
</div>
<script src="../assets/base.js"></script>
<script src="../assets/chk/chk.js"></script>
<script>
(function(){
  var q = document.getElementById('q');
  var rtitle = document.getElementById('rtitle');
  var rbadge = document.getElementById('rbadge');
  var rbody = document.getElementById('rbody');

  var DEMO = {
    id: '11010519491231002X',
    card: '4111 1111 1111 1111',
    uscc: '91350100M000100Y43',
    ean: '6901234567892',
    isbn: '0306406152'
  };

  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

  function paint(){
    var raw = q.value.trim();
    if (!raw){
      rtitle.textContent = '结果';
      rbadge.className = 'badge na';
      rbadge.textContent = '等你输入';
      rbody.innerHTML = '<div class="empty">粘一个号码进来，或者点上面的「试一个」。</div>';
      return;
    }
    var r = Chk.analyze(raw);
    rtitle.textContent = r.title;
    var ok = r.data.valid;
    var unknown = r.kind === 'unknown';
    rbadge.className = 'badge ' + (unknown ? 'na' : (ok ? 'ok' : 'bad'));
    rbadge.textContent = unknown ? '认不出' : (ok ? '校验通过' : '校验不通过');

    var html = '<table>';
    if (r.filled){
      html += '<tr><td class="k">补全后</td><td class="v">' + esc(r.filled) + '</td></tr>';
    }
    r.data.rows.forEach(function(row){
      html += '<tr><td class="k">' + esc(row[0]) + '</td><td class="v ' + (row[2] || '') + '">' + esc(row[1]) + '</td></tr>';
    });
    html += '</table>';
    rbody.innerHTML = html;
  }

  q.addEventListener('input', paint);

  [].forEach.call(document.querySelectorAll('[data-demo]'), function(b){
    b.addEventListener('click', function(){
      q.value = DEMO[b.getAttribute('data-demo')];
      paint();
      q.focus();
    });
  });

  q.value = DEMO.id;
  paint();
})();
</script>

.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
