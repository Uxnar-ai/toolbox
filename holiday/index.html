<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>离假期还有几天 · 下一个假期是哪天</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .col{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:820px){ .col{grid-template-columns:320px minmax(0,1fr); align-items:start} }
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft);
      border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .bd{padding:13px}
  .hero{padding:20px 16px 17px; border-bottom:1px solid var(--line)}
  .hero .lead{font-size:12px; color:var(--dim); margin-bottom:8px; letter-spacing:.3px}
  .hero .nm{font-size:16px; font-weight:500; color:var(--dim)}
  .hero .num{font-size:44px; font-weight:600; line-height:1.1; letter-spacing:-1px; margin-top:2px}
  .hero .num em{font-style:normal; font-size:17px; font-weight:500; color:var(--dim); margin-left:6px; letter-spacing:0}
  .hero .date{font-size:13.5px; color:var(--dim); margin-top:7px}
  .hero .date b{color:var(--fg); font-weight:500}
  .bar{height:6px; border-radius:99px; background:var(--soft); overflow:hidden; margin-top:14px}
  .bar i{display:block; height:100%; background:var(--accent); border-radius:99px}
  .barnote{display:flex; justify-content:space-between; font-size:11.5px; color:var(--dim); margin-top:5px}
  .f{display:flex; flex-direction:column; gap:5px}
  .f label{font-size:12px; color:var(--dim)}
  input, input[type=text]{
    font:13.5px/1.5 inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); width:100%; min-width:0
  }
  input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .row{
    display:flex; align-items:center; gap:12px; padding:11px 14px; border-top:1px solid var(--line);
    font-size:13.5px; min-width:0
  }
  .row:first-child{border-top:0}
  .row .nm{flex:0 0 74px; font-weight:500}
  .row .dt{flex:1 1 auto; color:var(--dim); font-size:12.5px; min-width:0; overflow:hidden;
           text-overflow:ellipsis; white-space:nowrap}
  .row .dt b{color:var(--fg); font-weight:500; font:500 13.5px/1.4 MiSans,system-ui,sans-serif}
  .row .dd{flex:0 0 auto; font:600 14px/1 ui-monospace,Menlo,Consolas,monospace;
           font-variant-numeric:tabular-nums; color:var(--dim); text-align:right; min-width:56px}
  .row .dd em{font-style:normal; font:400 11px/1 MiSans,system-ui,sans-serif; display:block; margin-top:4px; opacity:.75}
  .row.next{background:var(--soft)}
  .row.next .dd{color:var(--accent)}
  .row.past{opacity:.45}
  .foot{padding:10px 14px 13px; font-size:12px; color:var(--dim); line-height:1.75; border-top:1px solid var(--line)}
  .hint{font-size:12.5px; color:var(--dim); line-height:1.85; margin:14px 0 0}
  .hint b{color:var(--fg)}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:11px}
  .chips button{
    font:12px/1 inherit; padding:6px 10px; border-radius:99px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--dim)
  }
  .chips button:hover{border-color:var(--accent); color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>离假期还有几天</h1>
      <p class="lede">下一个假期是哪天、还有多少天，今年过完几成，一眼看完。</p>
    </div>
    <button class="toggle" id="theme">跟随系统</button>
  </header>

  <div class="col">
    <div>
      <div class="box">
        <div class="hero">
          <div class="lead">下一个假期</div>
          <div class="nm" id="hName">—</div>
          <div class="num" id="hNum">—<em id="hUnit">天</em></div>
          <div class="date" id="hDate"></div>
          <div class="bar"><i id="hBar" style="width:0"></i></div>
          <div class="barnote"><span id="hY">今年</span><span id="hLeft"></span></div>
        </div>
        <div class="bd">
          <div class="f">
            <label>按哪一天算（默认今天）</label>
            <input type="date" id="d">
          </div>
          <div class="chips">
            <button data-jump="0">今天</button>
            <button data-jump="30">一个月后</button>
            <button data-jump="180">半年后</button>
          </div>
        </div>
      </div>
      <p class="hint">
        <b>怎么算的</b>：春节按除夕那天起算（正月初一前一天），春节、端午、中秋都用农历推；清明按节气公式算。
        <b>不含调休</b> —— 具体放哪几天、补哪天班，以官方通知为准。
      </p>
    </div>

    <div class="box">
      <div class="hd"><span>接下来这几个</span><span id="cnt">—</span></div>
      <div id="list"></div>
      <div class="foot" id="foot">法定天数按 2025 年起的办法：春节 4 天、劳动节 2 天、其余各 1 天、国庆 3 天。</div>
    </div>
  </div>
</div>

<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  // 1900–2099 农历（低 4 位闰月，中间 12 位月大小，最高位闰月天数）
  var LUNAR_INFO = [
    0x4bd8,0x4ae0,0xa570,0x54d5,0xd260,0xd950,0x16554,0x56a0,0x9ad0,0x55d2,0x4ae0,0xa5b6,
    0xa4d0,0xd250,0x1d255,0xb540,0xd6a0,0xada2,0x95b0,0x14977,0x4970,0xa4b0,0xb4b5,0x6a50,
    0x6d40,0x1ab54,0x2b60,0x9570,0x52f2,0x4970,0x6566,0xd4a0,0xea50,0x6e95,0x5ad0,0x2b60,
    0x186e3,0x92e0,0x1c8d7,0xc950,0xd4a0,0x1d8a6,0xb550,0x56a0,0x1a5b4,0x25d0,0x92d0,0xd2b2,
    0xa950,0xb557,0x6ca0,0xb550,0x15355,0x4da0,0xa5d0,0x14573,0x52b0,0xa9a8,0xe950,0x6aa0,
    0xaea6,0xab50,0x4b60,0xaae4,0xa570,0x5260,0xf263,0xd950,0x5b57,0x56a0,0x96d0,0x4dd5,
    0x4ad0,0xa4d0,0xd4d4,0xd250,0xd558,0xb540,0xb5a0,0x195a6,0x95b0,0x49b0,0xa974,0xa4b0,
    0xb27a,0x6a50,0x6d40,0xaf46,0xab60,0x9570,0x4af5,0x4970,0x64b0,0x74a3,0xea50,0x6b58,
    0x5ac0,0xab60,0x96d5,0x92e0,0xc960,0xd954,0xd4a0,0xda50,0x7552,0x56a0,0xabb7,0x25d0,
    0x92d0,0xcab5,0xa950,0xb4a0,0xbaa4,0xad50,0x55d9,0x4ba0,0xa5b0,0x15176,0x52b0,0xa930,
    0x7954,0x6aa0,0xad50,0x5b52,0x4b60,0xa6e6,0xa4e0,0xd260,0xea65,0xd530,0x5aa0,0x76a3,
    0x96d0,0x4afb,0x4ad0,0xa4d0,0x1d0b6,0xd250,0xd520,0xdd45,0xb5a0,0x56d0,0x55b2,0x49b0,
    0xa577,0xa4b0,0xaa50,0x1b255,0x6d20,0xada0,0x14b63,0x9370,0x49f8,0x4970,0x64b0,0x168a6,
    0xea50,0x6aa0,0x1a6c4,0xaae0,0x92e0,0xd2e3,0xc960,0xd557,0xd4a0,0xda50,0x5d55,0x56a0,
    0xa6d0,0x55d4,0x52d0,0xa9b8,0xa950,0xb4a0,0xb6a6,0xad50,0x55a0,0xaba4,0xa5b0,0x52b0,
    0xb273,0x6930,0x7337,0x6aa0,0xad50,0x14b55,0x4b60,0xa570,0x54e4,0xd160,0xe968,0xd520,
    0xdaa0,0x16aa6,0x56d0,0x4ae0,0xa9d4,0xa2d0,0xd150,0xf252
  ];
  var BASE = Date.UTC(1900, 0, 31);
  var CN = '正二三四五六七八九十冬腊';
  var WK = ['日', '一', '二', '三', '四', '五', '六'];
  var ymCache = {}, mdCache = {};

  function yearMonths(y){
    if (ymCache[y]) return ymCache[y];
    var info = LUNAR_INFO[y - 1900], leap = info & 0xf, out = [];
    for (var m = 1; m <= 12; m++){
      out.push({ m: m, leap: false, days: (info & (0x10000 >> m)) ? 30 : 29 });
      if (leap === m) out.push({ m: m, leap: true, days: (info & 0x10000) ? 30 : 29 });
    }
    ymCache[y] = out;
    return out;
  }
  function yearDays(y){
    var ms = yearMonths(y), s = 0;
    for (var i = 0; i < ms.length; i++) s += ms[i].days;
    return s;
  }
  function lunarMD(d){
    var k = d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate();
    if (mdCache[k] !== undefined) return mdCache[k];
    var off = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - BASE) / 86400000);
    var res = null;
    if (off >= 0){
      var y = 1900;
      while (y < 2099 && off >= yearDays(y)){ off -= yearDays(y); y++; }
      if (y <= 2099){
        var ms = yearMonths(y), i = 0;
        while (i < ms.length - 1 && off >= ms[i].days){ off -= ms[i].days; i++; }
        if (off < ms[i].days) res = { y: y, m: ms[i].m, d: off + 1, leap: ms[i].leap };
      }
    }
    mdCache[k] = res;
    return res;
  }
  function ymd(d){
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function parseYmd(s){
    var m = String(s || '').match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function dayDiff(a, b){ return Math.round((new Date(b.getFullYear(), b.getMonth(), b.getDate()) -
                                             new Date(a.getFullYear(), a.getMonth(), a.getDate())) / 86400000); }
  function monthName(m){ return CN.charAt(m - 1) + '月'; }
  function dayName(n){
    if (n <= 10) return '初' + '一二三四五六七八九十'.charAt(n - 1);
    if (n < 20) return '十' + '一二三四五六七八九'.charAt(n - 11);
    if (n === 20) return '二十';
    if (n < 30) return '廿' + '一二三四五六七八九'.charAt(n - 21);
    return '三十';
  }
  function lunarText(d){
    var l = lunarMD(d);
    return l ? ('农历' + (l.leap ? '闰' : '') + monthName(l.m) + dayName(l.d)) : '';
  }

  // 在指定公历月份区间里找某个农历月日
  function findLunar(y, month, day, fromM, toM){
    var d = new Date(y, fromM - 1, 1), end = new Date(y, toM - 1, 31);
    while (d <= end){
      var l = lunarMD(d);
      if (l && !l.leap && l.m === month && l.d === day) return d;
      d = addDays(d, 1);
    }
    return null;
  }
  // 清明：21 世纪公式，day = floor(yy*0.2422+4.81) - floor(yy/4)
  function qingming(y){
    var yy = y % 100;
    var day = Math.floor(yy * 0.2422 + 4.81) - Math.floor(yy / 4);
    return new Date(y, 3, Math.min(Math.max(day, 4), 6));
  }

  function fests(y){
    var out = [];
    var cj = findLunar(y, 1, 1, 1, 2);
    out.push({ name: '元旦', d: new Date(y, 0, 1), days: 1, note: '' });
    if (cj) out.push({ name: '春节', d: addDays(cj, -1), days: 4, note: '除夕起 · 初一 ' + (cj.getMonth() + 1) + '/' + cj.getDate() });
    out.push({ name: '清明', d: qingming(y), days: 1, note: '' });
    out.push({ name: '劳动节', d: new Date(y, 4, 1), days: 2, note: '' });
    var dw = findLunar(y, 5, 5, 5, 7);
    if (dw) out.push({ name: '端午', d: dw, days: 1, note: lunarText(dw) });
    var zq = findLunar(y, 8, 15, 8, 10);
    if (zq) out.push({ name: '中秋', d: zq, days: 1, note: lunarText(zq) });
    out.push({ name: '国庆', d: new Date(y, 9, 1), days: 3, note: '' });
    return out;
  }

  function collect(from){
    var all = [], y0 = from.getFullYear();
    for (var y = y0 - 1; y <= y0 + 3; y++) all = all.concat(fests(y));
    all.sort(function(a, b){ return a.d - b.d; });
    return all;
  }

  function render(){
    var from = parseYmd($('d').value) || (function(){ var n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); })();
    var all = collect(from);
    var next = null;
    for (var i = 0; i < all.length; i++) if (all[i].d >= from){ next = all[i]; break; }

    if (next){
      var n = dayDiff(from, next.d);
      $('hName').textContent = next.name;
      $('hNum').firstChild.nodeValue = n === 0 ? '就是今天' : String(n);
      $('hUnit').textContent = n === 0 ? '' : '天';
      $('hDate').innerHTML = '<b>' + ymd(next.d) + '</b> 周' + WK[next.d.getDay()] +
        (next.note ? ' · ' + next.note : '') + ' · 法定 ' + next.days + ' 天';
    } else {
      $('hName').textContent = '—'; $('hNum').firstChild.nodeValue = '—'; $('hUnit').textContent = '';
    }

    var ys = from.getFullYear(), jan1 = new Date(ys, 0, 1), nextJan = new Date(ys + 1, 0, 1);
    var passed = dayDiff(jan1, from) + 1, total = dayDiff(jan1, nextJan);
    var pct = Math.min(100, Math.max(0, passed / total * 100));
    $('hBar').style.width = pct.toFixed(1) + '%';
    $('hY').textContent = ys + ' 年过了 ' + Math.round(pct) + '%';
    $('hLeft').textContent = '还剩 ' + (total - passed) + ' 天';

    var list = all.filter(function(x){ return x.d >= from; }).slice(0, 8);
    var past = all.filter(function(x){ return x.d < from; }).slice(-3);
    var rows = past.concat(list);
    $('list').innerHTML = rows.map(function(x){
      var n = dayDiff(from, x.d), isPast = n < 0, isNext = (next && x.d.getTime() === next.d.getTime());
      return '<div class="row' + (isNext ? ' next' : '') + (isPast ? ' past' : '') + '">' +
        '<span class="nm">' + x.name + '</span>' +
        '<span class="dt"><b>' + ymd(x.d) + '</b> 周' + WK[x.d.getDay()] +
          (x.note ? ' · ' + x.note : '') + '</span>' +
        '<span class="dd">' + (isPast ? '已过' : (n === 0 ? '今天' : n + ' 天')) +
          '<em>' + x.days + ' 天假</em></span></div>';
    }).join('');
    $('cnt').textContent = '未来 ' + list.length + ' 个';
  }

  var now = new Date();
  $('d').value = ymd(new Date(now.getFullYear(), now.getMonth(), now.getDate()));
  $('d').addEventListener('change', render);
  Array.prototype.forEach.call(document.querySelectorAll('[data-jump]'), function(b){
    b.addEventListener('click', function(){
      var base = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      $('d').value = ymd(addDays(base, +b.dataset.jump));
      render();
    });
  });
  render();
})();
</script>

  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;

</body>
</html>
