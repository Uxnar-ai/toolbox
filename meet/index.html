<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>跨时区开会 · 找出几边都在上班的那几个小时</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .picks{display:grid; grid-template-columns:1fr; gap:8px; margin-bottom:10px}
  @media (min-width:700px){ .picks{grid-template-columns:1fr 1fr 1fr auto} }
  select{font:inherit; font-size:13.5px; padding:9px 10px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--fg); min-width:0; width:100%}
  *:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .day{display:grid; grid-template-columns:1fr 1fr; gap:6px}
  .day button{font:inherit; font-size:13px; padding:0 14px; border-radius:9px; border:1px solid var(--line);
    background:var(--card); color:var(--dim); cursor:pointer; white-space:nowrap}
  .day button.on{border-color:var(--accent); background:var(--soft); color:var(--fg); font-weight:600}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px 14px}
  .gr{display:grid; grid-template-columns:76px minmax(0,1fr); gap:8px; align-items:center; margin-top:6px}
  .gr:first-child{margin-top:0}
  .gl{font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .gl.anchor{color:var(--fg); font-weight:600}
  .gr.head .gl{font-size:11.5px}
  .cells{display:grid; grid-template-columns:repeat(24,minmax(0,1fr)); gap:2px}
  .cells.head i{font-style:normal; font-size:10px; color:var(--dim); text-align:center; line-height:16px; overflow:hidden}
  @media (max-width:560px){
    .cells.head i[data-h="3"], .cells.head i[data-h="9"],
    .cells.head i[data-h="15"], .cells.head i[data-h="21"]{visibility:hidden}
  }
  i.c{display:block; height:22px; border-radius:3px; background:var(--soft); cursor:pointer; position:relative}
  i.c.n{background:color-mix(in srgb, var(--line) 85%, transparent)}
  i.c.w{background:var(--accent); opacity:.82}
  i.c.sel{outline:2px solid var(--fg); outline-offset:1px; opacity:1}
  .lg{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--dim); margin-top:11px; padding-top:10px; border-top:1px solid var(--line)}
  .lg span{display:inline-flex; align-items:center; gap:5px}
  .lg em{display:inline-block; width:13px; height:9px; border-radius:2px; background:var(--soft); font-style:normal}
  .lg em.w{background:var(--accent); opacity:.82}
  .lg em.n{background:color-mix(in srgb, var(--line) 85%, transparent)}
  .res{margin-top:14px; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px 16px}
  .res .big{font:600 21px/1.4 MiSans,system-ui,sans-serif; overflow-wrap:anywhere}
  .res .big em{font-style:normal; color:var(--accent)}
  .res .sub{font-size:12.5px; color:var(--dim); margin-top:7px; line-height:1.85}
  .nows{display:flex; flex-wrap:wrap; gap:7px; margin:0 0 12px}
  .nows span{font-size:12px; padding:4px 10px; border-radius:999px; background:var(--soft); color:var(--dim)}
  .nows span b{color:var(--fg); font-weight:600; font-variant-numeric:tabular-nums}
  .pickrow{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; align-items:center}
  .pickrow .lb{font-size:11.5px; color:var(--dim); margin-right:2px}
  .pickrow button{font:inherit; font-size:12px; padding:3px 9px; border-radius:999px; border:1px dashed var(--line);
    background:var(--card); color:var(--fg); cursor:pointer}
  .pickrow button:hover{border-color:var(--accent); color:var(--accent)}
  .tip{margin:14px 0 0; font-size:12.5px; color:var(--dim); line-height:1.85}
  .tip b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>跨时区开会</h1>
      <p class="lede">挑几个城市，一眼看出哪几个小时大家都醒着、哪几个小时都在上班，别约在别人半夜。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="picks">
    <select id="s0"></select>
    <select id="s1"></select>
    <select id="s2"></select>
    <div class="day" id="day">
      <button type="button" data-d="0" class="on">今天</button>
      <button type="button" data-d="1">明天</button>
    </div>
  </div>

  <div class="nows" id="nows"></div>

  <div class="card">
    <div class="gr head">
      <span class="gl">当地时间 →</span>
      <div class="cells head" id="hh"></div>
    </div>
    <div id="grid"></div>
    <div class="lg">
      <span><em class="w"></em>上班（9–18 点）</span>
      <span><em></em>醒着（7–23 点）</span>
      <span><em class="n"></em>休息</span>
      <span style="margin-left:auto">格子按第一列城市的时间排</span>
    </div>
    <div class="pickrow" id="quick">
      <span class="lb">常约的组合</span>
      <button type="button" data-set="北京,伦敦">北京 + 伦敦</button>
      <button type="button" data-set="北京,柏林">北京 + 柏林</button>
      <button type="button" data-set="北京,纽约">北京 + 纽约</button>
      <button type="button" data-set="北京,旧金山">北京 + 旧金山</button>
      <button type="button" data-set="北京,柏林,纽约">北京 + 柏林 + 纽约</button>
    </div>
  </div>

  <div class="res" id="res"></div>

  <p class="tip">
    <b>怎么读</b>：每一行是一个城市，从左到右是第一个城市当地的 0 点到 23 点。深色格子表示那个城市正在上班（9–18 点）。<br>
    <b>点格子</b>看那一刻各地分别几点；上面三个下拉换城市，「常约的组合」一键套用。<br>
    <b>夏令时自动算</b>，不需要自己加一小时。中国不实行夏令时，所以北京那行永远一样。
  </p>

  <footer>全部在浏览器里算，不联网、不记录。</footer>
</div>
<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };

  var CITIES = [
    ['北京', 'Asia/Shanghai'], ['上海', 'Asia/Shanghai'], ['深圳', 'Asia/Shanghai'],
    ['成都', 'Asia/Shanghai'], ['东京', 'Asia/Tokyo'], ['首尔', 'Asia/Seoul'],
    ['新加坡', 'Asia/Singapore'], ['曼谷', 'Asia/Bangkok'], ['雅加达', 'Asia/Jakarta'],
    ['孟买', 'Asia/Kolkata'], ['迪拜', 'Asia/Dubai'], ['莫斯科', 'Europe/Moscow'],
    ['伊斯坦布尔', 'Europe/Istanbul'], ['柏林', 'Europe/Berlin'], ['巴黎', 'Europe/Paris'],
    ['伦敦', 'Europe/London'], ['里斯本', 'Europe/Lisbon'], ['开罗', 'Africa/Cairo'],
    ['约翰内斯堡', 'Africa/Johannesburg'], ['纽约', 'America/New_York'],
    ['芝加哥', 'America/Chicago'], ['丹佛', 'America/Denver'],
    ['洛杉矶', 'America/Los_Angeles'], ['旧金山', 'America/Los_Angeles'],
    ['多伦多', 'America/Toronto'], ['温哥华', 'America/Vancouver'],
    ['墨西哥城', 'America/Mexico_City'], ['圣保罗', 'America/Sao_Paulo'],
    ['悉尼', 'Australia/Sydney'], ['奥克兰', 'Pacific/Auckland']
  ];
  var WORK = 9, WORK_END = 18, AWAKE = 7, AWAKE_END = 23;
  var dayOffset = 0;
  var selHour = null;

  var fmtCache = {};
  function dtf(tz){
    if (!fmtCache[tz]){
      fmtCache[tz] = new Intl.DateTimeFormat('en-US', {
        timeZone: tz, hour12: false,
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit'
      });
    }
    return fmtCache[tz];
  }
  function parts(date, tz){
    var o = {}, ps = dtf(tz).formatToParts(date);
    for (var i = 0; i < ps.length; i++) o[ps[i].type] = ps[i].value;
    return o;
  }
  function offsetMin(date, tz){
    var p = parts(date, tz);
    var asUTC = Date.UTC(+p.year, +p.month - 1, +p.day, (+p.hour) % 24, +p.minute, +p.second);
    return Math.round((asUTC - date.getTime()) / 60000);
  }
  function localHour(date, tz){
    var p = parts(date, tz);
    return (+p.hour) % 24;
  }
  function hhmm(date, tz){
    var p = parts(date, tz);
    return ((+p.hour) % 24 < 10 ? '0' : '') + ((+p.hour) % 24) + ':' + p.minute;
  }

  /* 第一个城市某天本地 hour 点 → 真实时刻 */
  function instantAt(anchorTz, y, m, d, hour){
    var guess = Date.UTC(y, m, d, hour, 0, 0);
    var off = offsetMin(new Date(guess), anchorTz);
    var t = guess - off * 60000;
    var off2 = offsetMin(new Date(t), anchorTz);
    if (off2 !== off) t = guess - off2 * 60000;
    return new Date(t);
  }

  function pad(n){ return n < 10 ? '0' + n : '' + n; }

  function currentPicks(){
    return [$('s0'), $('s1'), $('s2')].map(function(s){ return s.value; });
  }

  function fillSelects(){
    [$('s0'), $('s1'), $('s2')].forEach(function(s, i){
      s.innerHTML = CITIES.map(function(c){
        return '<option value="' + c[1] + '" data-n="' + c[0] + '">' + c[0] + '</option>';
      }).join('');
      s.selectedIndex = [0, 13, 19][i];
    });
  }

  function nameOf(tz){
    for (var i = 0; i < CITIES.length; i++) if (CITIES[i][1] === tz) return CITIES[i][0];
    return tz;
  }

  function render(){
    var zones = currentPicks().filter(function(z, i, a){ return a.indexOf(z) === i; });
    var names = zones.map(nameOf);
    var anchor = zones[0];

    var now = new Date();
    $('nows').innerHTML = zones.map(function(tz, i){
      return '<span>' + names[i] + ' <b>' + hhmm(now, tz) + '</b></span>';
    }).join('');

    var base = new Date(now.getFullYear(), now.getMonth(), now.getDate() + dayOffset);
    var y = base.getFullYear(), m = base.getMonth(), d = base.getDate();

    // 表头
    var hh = '';
    for (var h = 0; h < 24; h++) hh += '<i data-h="' + h + '">' + (h % 3 === 0 ? h : '') + '</i>';
    $('hh').innerHTML = hh;

    var matrix = [], rows = '';
    zones.forEach(function(tz){
      var row = [];
      for (var h2 = 0; h2 < 24; h2++){
        row.push(localHour(instantAt(anchor, y, m, d, h2), tz));
      }
      matrix.push(row);
    });

    var runs = [], start = null;
    for (var h3 = 0; h3 <= 24; h3++){
      var ok = h3 < 24 && matrix.every(function(row){
        var lh = row[h3];
        return lh >= WORK && lh < WORK_END;
      });
      if (ok && start === null) start = h3;
      if (!ok && start !== null){ runs.push([start, h3]); start = null; }
    }
    var bestHour = 0, bestScore = -1;
    for (var hb = 0; hb < 24; hb++){
      var sc = 0, aw = 0;
      matrix.forEach(function(row){
        var lh = row[hb];
        if (lh >= WORK && lh < WORK_END) sc++;
        else if (lh >= AWAKE && lh < AWAKE_END) aw++;
      });
      var score = sc * 10 + aw;
      if (matrix[0][hb] >= WORK && matrix[0][hb] < WORK_END) score += 6;
      if (score > bestScore){ bestScore = score; bestHour = hb; }
    }
    if (selHour === null) selHour = runs.length ? runs[0][0] : bestHour;

    function stateText(lh){
      if (lh >= WORK && lh < WORK_END) return '上班';
      if (lh >= AWAKE && lh < AWAKE_END) return '醒着';
      return '睡觉';
    }
    function stateLine(h, skipFirst){
      var inst = instantAt(anchor, y, m, d, h);
      return zones.map(function(tz, i){
        if (skipFirst && i === 0) return null;
        return names[i] + ' ' + hhmm(inst, tz) + ' ' + stateText(matrix[i][h]);
      }).filter(Boolean).join(' · ');
    }

    zones.forEach(function(tz, ri){
      var cells = '';
      for (var h2 = 0; h2 < 24; h2++){
        var lh = matrix[ri][h2];
        var cls = (lh >= WORK && lh < WORK_END) ? 'w' : ((lh >= AWAKE && lh < AWAKE_END) ? '' : 'n');
        cells += '<i class="c ' + cls + (selHour === h2 ? ' sel' : '') + '" data-h="' + h2 + '"></i>';
      }
      rows += '<div class="gr"><span class="gl' + (ri === 0 ? ' anchor' : '') + '">' + names[ri] +
        '</span><div class="cells">' + cells + '</div></div>';
    });
    $('grid').innerHTML = rows;

    var html = '';
    if (runs.length){
      var total = runs.reduce(function(a, r){ return a + (r[1] - r[0]); }, 0);
      html += '<div class="big">' + (dayOffset ? '明天' : '今天') + '都在上班：' +
        runs.map(function(r){ return '<em>' + pad(r[0]) + ':00–' + pad(r[1]) + ':00</em>'; }).join('、') +
        '（共 ' + total + ' 小时）</div>';
      html += '<div class="sub">按 ' + names[0] + ' 时间写的。' + detailText(zones, names, y, m, d, runs[0][0]) + '</div>';
    } else {
      html += '<div class="big">这几个城市没有全都上班的时段</div>';
      html += '<div class="sub">最接近 ' + names[0] + ' ' + pad(selHour) + ':00 —— ' +
        stateLine(selHour, true) + '。少挑一个城市会好约很多，或者接受有人早起 / 晚走。</div>';
    }
    $('res').innerHTML = html;

    // 点格子
    [].forEach.call(document.querySelectorAll('#grid i.c'), function(el){
      el.addEventListener('click', function(){
        selHour = +el.getAttribute('data-h');
        [].forEach.call(document.querySelectorAll('#grid i.c'), function(x){
          x.classList.toggle('sel', x.getAttribute('data-h') === String(selHour));
        });
        var sub = $('res').querySelector('.sub');
        if (sub) sub.innerHTML = detailText(zones, names, y, m, d, selHour);
      });
    });
  }

  function detailText(zones, names, y, m, d, hour){
    var inst = instantAt(zones[0], y, m, d, hour);
    var bits = zones.map(function(tz, i){
      return names[i] + ' ' + hhmm(inst, tz);
    });
    return '那一刻：' + bits.join(' · ') + '。';
  }

  /* 交互 */
  fillSelects();
  ['s0', 's1', 's2'].forEach(function(id){
    $(id).addEventListener('change', function(){
      var v = currentPicks();
      if (v[0] === v[1] || v[0] === v[2] || (v[1] && v[1] === v[2])){
        // 允许重复，但只渲染唯一城市；不为重复报错
      }
      selHour = null;
      render();
    });
  });
  $('day').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    dayOffset = +b.getAttribute('data-d');
    [].forEach.call($('day').children, function(x){ x.classList.toggle('on', x === b); });
    selHour = null;
    render();
  });
  $('quick').addEventListener('click', function(e){
    var b = e.target.closest('button');
    if (!b) return;
    var names = b.getAttribute('data-set').split(',');
    [$('s0'), $('s1'), $('s2')].forEach(function(s, i){
      var want = names[i];
      if (!want){ s.selectedIndex = i === 2 ? 1 : 0; return; }
      for (var k = 0; k < s.options.length; k++){
        if (s.options[k].getAttribute('data-n') === want){ s.selectedIndex = k; break; }
      }
    });
    selHour = null;
    render();
  });
  render();
})();
</script>

<a class="tb-nav" href="../" title="回到工具台">⌂ 工具台</a>
<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
