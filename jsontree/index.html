<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 树 · 折叠浏览、查路径</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .bar{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:12px}
  button.b{
    font:500 13px/1.2 inherit; padding:8px 13px; border-radius:9px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg);
    transition:border-color .15s,color .15s;
  }
  button.b:hover{border-color:var(--accent); color:var(--accent)}
  .bar input[type=text]{width:200px}
  textarea{height:420px}
  .tree{height:420px; overflow:auto; padding:10px 6px 10px 10px; background:var(--card)}
  .row{
    display:flex; align-items:baseline; gap:6px; padding:3px 6px 3px 0; border-radius:6px;
    font:13px/1.75 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; cursor:default;
    white-space:nowrap;
  }
  .row:hover{background:var(--soft)}
  .row .ind{flex:0 0 auto}
  .row .tw{
    flex:0 0 13px; width:13px; text-align:center; color:var(--dim); cursor:pointer;
    font-size:10px; user-select:none; transition:transform .1s;
  }
  .row .tw.open{transform:rotate(90deg)}
  .row .tw.leaf{opacity:0; cursor:default}
  .row .k{color:var(--fg); cursor:pointer; border-radius:3px; padding:0 2px}
  .row .k:hover{background:color-mix(in srgb, var(--accent) 16%, transparent)}
  .row .k .q{color:var(--dim); font-weight:400}
  .row .idx{color:var(--dim); font-size:12px}
  .row .val{color:var(--dim)}
  .row .val.s{color:var(--ok)}
  .row .val.n{color:var(--accent)}
  .row .val.b{color:var(--warn)}
  .row .val.z{color:var(--dim); opacity:.8}
  .row .cnt{color:var(--dim); font-size:12px}
  .row .cp{
    margin-left:auto; font-size:11px; color:var(--dim); border:1px solid var(--line);
    background:var(--card); border-radius:5px; padding:0 5px; cursor:pointer; opacity:0;
    white-space:nowrap;
  }
  .row:hover .cp{opacity:1}
  .row .cp:hover{color:var(--accent); border-color:var(--accent)}
  .row.hit{background:color-mix(in srgb, var(--warn) 14%, transparent)}
  .row .hl{background:color-mix(in srgb, var(--warn) 40%, transparent); border-radius:2px}
  .err{margin-bottom:12px}
  .stats{display:flex; gap:6px 16px; flex-wrap:wrap; font-size:12.5px; color:var(--dim); margin-top:10px}
  .stats b{color:var(--fg); font-weight:600}
  .toast{
    position:fixed; left:50%; bottom:26px; transform:translateX(-50%) translateY(12px);
    background:var(--fg); color:var(--bg); font-size:12.5px; padding:8px 16px; border-radius:999px;
    opacity:0; pointer-events:none; transition:opacity .18s, transform .18s; z-index:999;
  }
  .toast.on{opacity:.94; transform:translateX(-50%) translateY(0)}
  .hint{font-size:12.5px; color:var(--dim); line-height:1.9; margin-top:12px}
  @media (max-width:560px){ textarea,.tree{height:320px} .bar input[type=text]{width:130px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>JSON 树</h1>
      <p class="lede">接口返回一大坨 JSON，折叠着看结构；点键名复制路径（$.data.list[0].id），点值复制值。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="bar">
    <input type="text" id="q" placeholder="搜键名或值…" spellcheck="false">
    <button class="b" id="lvl2">展开两层</button>
    <button class="b" id="all">全部展开</button>
    <button class="b" id="none">全部收起</button>
    <span class="grow"></span>
    <button class="b" id="fmt">整理格式</button>
    <button class="b" id="sample">看示例</button>
    <button class="b" id="clear">清空</button>
  </div>

  <div class="err" id="err"></div>

  <div class="panes">
    <div class="pane">
      <h2><span>原文</span><span id="size">0 B</span></h2>
      <textarea id="src" spellcheck="false" placeholder='{"name":"demo","list":[{"id":1}]}'></textarea>
    </div>
    <div class="pane">
      <h2><span>结构</span><span id="tip">点键名复制路径</span></h2>
      <div class="tree" id="tree"></div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
  <div class="toast" id="toast"></div>

  <div class="hint">
    路径用 <code>$</code> 开头，对象用点、数组用方括号 —— 这种写法在 jq、Postman、代码里都能对上号，比说「第三层的那个 id」清楚。
    搜索框里输入关键词，命中的行会亮起来、上层自动展开，不相关的先藏起来。数字、布尔、null 的颜色不同，字符串是绿色。
  </div>

  <footer>
    解析和渲染都在本机完成，几百 KB 的响应也不发一个字节出去。节点太多（超过 4000 个）时只渲染前面一部分，免得页面卡住。
  </footer>
</div>

<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var srcEl = $('src'), treeEl = $('tree'), statsEl = $('stats'), errEl = $('err');
  var qEl = $('q'), sizeEl = $('size'), toastEl = $('toast');
  var model = null, stat = {keys:0, nodes:0, depth:0, arrays:0, objs:0};
  var MAXNODE = 4000;

  var SAMPLE = JSON.stringify({
    code: 0,
    message: "ok",
    data: {
      total: 2,
      page: 1,
      list: [
        {id: 10231, name: "机械键盘", price: 499, tags: ["数码", "配件"], stock: 0, active: false, note: null},
        {id: 10232, name: "静音鼠标", price: 129.9, tags: [], stock: 37, active: true, note: "包邮"}
      ]
    }
  }, null, 2);

  function toast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(function(){ toastEl.classList.remove('on'); }, 1400);
  }

  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function bytes(n){
    if (n < 1024) return n + ' B';
    if (n < 1048576) return (n/1024).toFixed(1) + ' KB';
    return (n/1048576).toFixed(2) + ' MB';
  }

  function typeName(v){
    if (v === null) return 'null';
    if (Array.isArray(v)) return 'array';
    return typeof v;
  }

  // 把值转成可搜索、可折叠的模型
  function build(key, val, path, depth){
    stat.nodes++;
    if (depth > stat.depth) stat.depth = depth;
    var node = {key: key, path: path, depth: depth, type: typeName(val), val: val, children: null, open: depth <= 1};
    if (node.type === 'object'){
      stat.objs++;
      var keys = Object.keys(val);
      stat.keys += keys.length;
      node.children = keys.map(function(k){
        return build(k, val[k], path + '.' + k, depth + 1);
      });
    } else if (node.type === 'array'){
      stat.arrays++;
      node.children = val.map(function(v, i){
        return build(String(i), v, path + '[' + i + ']', depth + 1);
      });
    }
    return node;
  }

  function markup(str, q){
    var s = esc(str);
    if (!q) return s;
    var i = s.toLowerCase().indexOf(q.toLowerCase());
    if (i < 0) return s;
    return s.slice(0, i) + '<span class="hl">' + s.slice(i, i + q.length) + '</span>' + s.slice(i + q.length);
  }

  function preview(node){
    var v = node.val, t = node.type;
    if (t === 'string'){
      var s = v.length > 60 ? v.slice(0, 60) + '…' : v;
      return '<span class="val s">"' + esc(s) + '"</span>';
    }
    if (t === 'number') return '<span class="val n">' + v + '</span>';
    if (t === 'boolean') return '<span class="val b">' + v + '</span>';
    if (t === 'null') return '<span class="val z">null</span>';
    return '';
  }

  function countChildren(node){
    return node.children ? node.children.length : 0;
  }

  function matches(node, q){
    if (!q) return true;
    var hay = node.key + ' ' + (node.children ? '' : String(node.val));
    return hay.toLowerCase().indexOf(q.toLowerCase()) >= 0;
  }

  function hasMatch(node, q){
    if (matches(node, q)) return true;
    if (!node.children) return false;
    for (var i = 0; i < node.children.length; i++){
      if (hasMatch(node.children[i], q)) return true;
    }
    return false;
  }

  var rendered = 0;

  function renderNode(node, q, forceOpen){
    if (q && !hasMatch(node, q)) return null;
    if (rendered >= MAXNODE) return null;
    rendered++;

    var wrap = document.createElement('div');
    var row = document.createElement('div');
    row.className = 'row';
    row.style.paddingLeft = (node.depth * 15) + 'px';
    if (q && matches(node, q)) row.classList.add('hit');

    var isBranch = !!node.children;
    var open = forceOpen ? true : (q ? true : node.open);

    var tw = document.createElement('span');
    tw.className = 'tw' + (isBranch ? (open ? ' open' : '') : ' leaf');
    tw.textContent = '▶';
    row.appendChild(tw);

    var k = document.createElement('span');
    k.className = 'k';
    var label = (node.depth === 0) ? '$' : node.key;
    var isIdx = node.depth > 0 && /^\d+$/.test(node.key) && node.path.slice(-1) === ']';
    k.innerHTML = '<span class="' + (isIdx ? 'idx' : 'q') + '">' + markup(label, q) + '</span>' +
                  '<span class="q">' + (isBranch ? '' : ':') + '</span>';
    k.title = node.path;
    k.addEventListener('click', function(e){
      e.stopPropagation();
      copyText(node.path);
      toast('已复制路径 ' + node.path);
    });
    row.appendChild(k);

    if (isBranch){
      var cnt = document.createElement('span');
      cnt.className = 'cnt';
      var n = countChildren(node);
      cnt.textContent = (node.type === 'array' ? '[' + n + ' 项]' : '{' + n + ' 个键}') + (open ? '' : '  …');
      row.appendChild(cnt);
    } else {
      var holder = document.createElement('span');
      holder.innerHTML = preview(node);
      row.appendChild(holder);
      var cp = document.createElement('span');
      cp.className = 'cp';
      cp.textContent = '复制值';
      cp.addEventListener('click', function(e){
        e.stopPropagation();
        copyText(typeof node.val === 'string' ? node.val : JSON.stringify(node.val));
        toast('已复制值');
      });
      row.appendChild(cp);
    }

    wrap.appendChild(row);

    if (isBranch){
      var box = document.createElement('div');
      box.style.display = open ? '' : 'none';
      node.children.forEach(function(ch){
        var el = renderNode(ch, q, forceOpen);
        if (el) box.appendChild(el);
      });
      wrap.appendChild(box);
      tw.addEventListener('click', function(){
        var show = box.style.display === 'none';
        box.style.display = show ? '' : 'none';
        node.open = show;
        tw.classList.toggle('open', show);
        var c2 = row.querySelector('.cnt');
        if (c2){
          var n2 = countChildren(node);
          var suffix = c2.textContent.indexOf('…') >= 0;
          c2.textContent = (node.type === 'array' ? '[' + n2 + ' 项]' : '{' + n2 + ' 个键}') + (show ? '' : '  …');
        }
      });
      row.addEventListener('dblclick', function(){ tw.click(); });
    }

    return wrap;
  }

  function expandAll(forceOpen){
    if (!model) return;
    qEl.value = '';
    treeEl.innerHTML = '';
    rendered = 0;
    stat = {keys: stat.keys, nodes: 0, depth: 0, arrays: 0, objs: 0};
    var el = renderNode(model, '', forceOpen);
    if (el) treeEl.appendChild(el);
  }

  function draw(forceOpen){
    if (!model) return;
    treeEl.innerHTML = '';
    rendered = 0;
    var q = qEl.value.trim();
    var el = renderNode(model, q, forceOpen);
    if (el) treeEl.appendChild(el);
    if (!treeEl.childNodes.length){
      treeEl.innerHTML = '<div class="empty">没有匹配「' + esc(q) + '」的键或值。</div>';
    }
  }

  function fail(msg, pos){
    errEl.className = 'err on';
    errEl.innerHTML = msg + (pos !== null && pos !== undefined ? ' <a href="#" id="goerr" style="color:inherit;text-decoration:underline">跳到出错处</a>' : '');
    var g = $('goerr');
    if (g) g.addEventListener('click', function(ev){
      ev.preventDefault();
      srcEl.focus();
      srcEl.setSelectionRange(pos, Math.min(pos + 1, srcEl.value.length));
    });
    treeEl.innerHTML = '<div class="empty">JSON 解析失败，修好左边再看这里。</div>';
    statsEl.innerHTML = '';
    model = null;
  }

  function parse(){
    var text = srcEl.value;
    sizeEl.textContent = bytes(new Blob([text]).size);
    if (!text.trim()){
      errEl.className = 'err';
      treeEl.innerHTML = '<div class="empty">左边粘一段 JSON，这里出结构树。</div>';
      statsEl.innerHTML = '';
      model = null;
      return;
    }
    var val;
    try {
      val = JSON.parse(text);
    } catch (e){
      var m = String(e.message), pos = null;
      var pm = m.match(/position\s+(\d+)/i);
      if (pm) pos = parseInt(pm[1], 10);
      var extra = '';
      var lm = m.match(/line\s+(\d+)\s+column\s+(\d+)/i);
      if (lm){
        extra = ' 位置：第 ' + lm[1] + ' 行第 ' + lm[2] + ' 列。';
        if (pos === null){
          var ls = text.split('\n'), ln = Math.max(0, parseInt(lm[1], 10) - 1);
          pos = 0;
          for (var q2 = 0; q2 < ln && q2 < ls.length; q2++) pos += ls[q2].length + 1;
          pos += Math.max(0, parseInt(lm[2], 10) - 1);
        }
      } else if (pos !== null && pos <= text.length){
        var before = text.slice(0, pos);
        var line = before.split('\n').length;
        var col = pos - before.lastIndexOf('\n');
        extra = ' 位置：第 ' + line + ' 行第 ' + col + ' 列。';
      }
      fail(esc(m) + extra, pos);
      return;
    }
    errEl.className = 'err';
    stat = {keys:0, nodes:0, depth:0, arrays:0, objs:0};
    model = build('$', val, '$', 0);
    model.open = true;
    draw(false);

    var bits = [];
    bits.push('键 <b>' + stat.keys + '</b>');
    bits.push('节点 <b>' + stat.nodes + '</b>');
    bits.push('对象 <b>' + stat.objs + '</b> · 数组 <b>' + stat.arrays + '</b>');
    bits.push('最深层级 <b>' + stat.depth + '</b>');
    if (stat.nodes > MAXNODE) bits.push('<b>只渲染了前 ' + MAXNODE + ' 个节点</b>');
    statsEl.innerHTML = bits.join('');
  }

  srcEl.addEventListener('input', parse);
  qEl.addEventListener('input', function(){ draw(true); });
  $('lvl2').addEventListener('click', function(){
    if (!model) return;
    qEl.value = '';
    (function walk(n){ n.open = n.depth <= 1; (n.children || []).forEach(walk); })(model);
    draw(false);
  });
  $('all').addEventListener('click', function(){
    if (!model) return;
    qEl.value = '';
    (function walk(n){ n.open = true; (n.children || []).forEach(walk); })(model);
    draw(false);
  });
  $('none').addEventListener('click', function(){
    if (!model) return;
    qEl.value = '';
    (function walk(n){ n.open = n.depth < 0; (n.children || []).forEach(walk); })(model);
    model.open = true;
    draw(false);
  });
  $('fmt').addEventListener('click', function(){
    try {
      srcEl.value = JSON.stringify(JSON.parse(srcEl.value), null, 2);
      parse();
      toast('已整理成两格缩进');
    } catch (e){ toast('解析失败，没法整理'); }
  });
  $('sample').addEventListener('click', function(){ srcEl.value = SAMPLE; parse(); });
  $('clear').addEventListener('click', function(){ srcEl.value = ''; parse(); srcEl.focus(); });

  srcEl.value = SAMPLE;
  parse();
})();
</script>

<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
