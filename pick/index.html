<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>名单分组 · 随机分组和抽签，不掺人情</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .panes{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:900px){ .panes{grid-template-columns:330px 1fr; align-items:start} }
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; min-width:0}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft); border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .bd{padding:13px}
  textarea{
    width:100%; height:250px; resize:vertical; font:14px/1.75 MiSans,system-ui,sans-serif;
    padding:10px 12px; border:1px solid var(--line); border-radius:10px;
    background:var(--card); color:var(--fg);
  }
  *:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
  .seg{display:grid; grid-template-columns:1fr 1fr 1fr; gap:7px; margin:12px 0 10px}
  .seg button{padding:8px 3px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg); font:inherit; font-size:12.5px; cursor:pointer}
  .seg button.on{border-color:var(--accent); background:var(--soft); font-weight:600}
  .fl{display:flex; align-items:center; gap:9px; font-size:12.5px; color:var(--dim); margin:9px 0}
  .fl input[type=number]{width:78px; font:inherit; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--fg)}
  .acts{display:grid; grid-template-columns:1fr; gap:8px; margin-top:12px}
  .acts button.pri{font:inherit; font-size:14px; padding:11px; border-radius:10px; cursor:pointer; border:0; background:var(--accent); color:var(--accent-fg); font-weight:600}
  .acts button.gh{font:inherit; font-size:12.5px; padding:8px; border-radius:9px; cursor:pointer; border:1px solid var(--line); background:var(--card); color:var(--dim)}
  .acts button.gh:hover{border-color:var(--accent); color:var(--accent)}
  .res{padding:14px}
  .meta{font-size:12.5px; color:var(--dim); margin-bottom:12px; display:flex; gap:12px; flex-wrap:wrap}
  .meta b{color:var(--fg)}
  .grps{display:grid; gap:10px; grid-template-columns:1fr 1fr}
  @media (max-width:640px){ .grps{grid-template-columns:1fr} }
  .grp{border:1px solid var(--line); border-radius:10px; overflow:hidden; min-width:0}
  .gt{padding:7px 11px; background:var(--soft); font-size:12px; color:var(--dim); display:flex; justify-content:space-between; gap:8px}
  .gt b{color:var(--fg); font-size:12.5px}
  .names{padding:9px 11px; display:flex; flex-wrap:wrap; gap:6px}
  .names span{font-size:13px; padding:3px 9px; border-radius:999px; background:var(--soft); color:var(--fg); overflow-wrap:anywhere; max-width:100%}
  .pickone{text-align:center; padding:22px 12px 18px}
  .pickone .big{font:600 40px/1.25 MiSans,system-ui,sans-serif; color:var(--accent); overflow-wrap:anywhere}
  .pickone .sub{font-size:13px; color:var(--dim); margin-top:8px}
  .drawlist{display:flex; flex-wrap:wrap; gap:7px; justify-content:center; margin-top:14px}
  .drawlist span{font-size:13px; padding:4px 11px; border-radius:999px; border:1px solid var(--line); color:var(--dim)}
  .drawlist span.hit{border-color:var(--accent); background:var(--soft); color:var(--fg); font-weight:600}
  .empty{padding:40px 12px; text-align:center; color:var(--dim); font-size:13px}
  .tip{margin:14px 0 0; font-size:12.5px; color:var(--dim); line-height:1.85}
  .tip b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>名单分组</h1>
      <p class="lede">名单一行一个粘进来，随机分成几组或者抽人，结果直接复制到群里。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="panes">
    <div class="box">
      <div class="hd"><span>名单</span><span id="cnt">12 人</span></div>
      <div class="bd">
        <textarea id="names" spellcheck="false">张伟
王芳
李娜
刘洋
陈静
杨帆
赵磊
黄敏
周涛
吴倩
徐亮
孙悦</textarea>

        <div class="seg" id="modes">
          <button type="button" data-mode="byGroups" class="on">分成几组</button>
          <button type="button" data-mode="bySize">每组几人</button>
          <button type="button" data-mode="draw">抽签</button>
        </div>

        <div class="fl" id="nRow">
          <span id="nLab">分几组</span>
          <input type="number" id="n" value="3" min="1" max="50" step="1">
          <span id="nUnit">组</span>
        </div>

        <div class="acts">
          <button type="button" class="pri" id="go">开始分</button>
          <button type="button" class="gh" id="again">↻ 重新洗牌</button>
          <button type="button" class="gh" id="copy">复制结果</button>
        </div>
      </div>
    </div>

    <div class="box">
      <div class="hd"><span>结果</span><span id="modeTxt">分 3 组</span></div>
      <div class="res" id="res"><div class="empty">左边填名单，点「开始分」</div></div>
    </div>
  </div>

  <p class="tip">
    <b>一行一个名字</b>；粘成一串也行，逗号、顿号、空格、分号都会自动拆开，重复的名字只留一个。<br>
    <b>分成几组</b>人数尽量平均，除不尽的先分给前几组；<b>每组几人</b>按人数上限往后排，最后一组可能少几个。<br>
    <b>抽签</b>不会重复抽同一个人。随机用的是系统自带的加密随机数，不是 <code>Math.random</code>。
  </p>

  <footer>名单只在你的浏览器里，不上传、不记录。</footer>
</div>
<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var mode = 'byGroups';
  var last = null;                 // 上一次结果，复制用

  function rnd(n){
    if (n <= 0) return 0;
    var max = Math.floor(4294967296 / n) * n;
    var a = new Uint32Array(1);
    do { crypto.getRandomValues(a); } while (a[0] >= max);
    return a[0] % n;
  }
  function shuffle(arr){
    for (var i = arr.length - 1; i > 0; i--){
      var j = rnd(i + 1);
      var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
    }
    return arr;
  }

  function parseNames(){
    var raw = $('names').value || '';
    var parts = raw.split(/[\n\r,，、;；\t]+/);
    var out = [], seen = {};
    for (var i = 0; i < parts.length; i++){
      var s = parts[i].trim();
      if (!s) continue;
      if (seen[s]) continue;
      seen[s] = 1;
      out.push(s);
    }
    return out;
  }

  function updateCount(){
    var n = parseNames().length;
    $('cnt').textContent = n ? n + ' 人' : '空';
  }

  function render(res){
    last = res;
    if (!res){
      $('res').innerHTML = '<div class="empty">左边填名单，点「开始分」</div>';
      return;
    }
    var total = res.all.length;
    if (mode === 'draw' && res.drawn){
      var hit = {};
      for (var i = 0; i < res.drawn.length; i++) hit[res.drawn[i]] = 1;
      var big = res.drawn.join(' · ');
      var chips = '';
      for (var k = 0; k < res.all.length; k++){
        var nm = res.all[k].replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; });
        chips += '<span class="' + (hit[res.all[k]] ? 'hit' : '') + '">' + nm + '</span>';
      }
      $('res').innerHTML = '<div class="pickone"><div class="big">' + big.replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</div>'
        + '<div class="sub">从 ' + total + ' 人里抽 ' + res.drawn.length + ' 个' + (res.drawNo > 1 ? ' · 第 ' + res.drawNo + ' 次' : '') + '</div></div>'
        + '<div class="drawlist">' + chips + '</div>';
      return;
    }
    if (!res.groups){
      $('res').innerHTML = '<div class="empty">左边填名单，点「开始分」</div>';
      return;
    }
    var html = '<div class="meta"><span>共 <b>' + total + '</b> 人</span><span><b>' + res.groups.length + '</b> 组</span>'
      + '<span>每组 <b>' + res.sizes[0] + (res.sizes[0] !== res.sizes[res.sizes.length - 1] ? '～' + res.sizes[res.sizes.length - 1] : '') + '</b> 人</span></div>'
      + '<div class="grps">';
    for (var g = 0; g < res.groups.length; g++){
      html += '<div class="grp"><div class="gt"><b>第 ' + (g + 1) + ' 组</b><span>' + res.groups[g].length + ' 人</span></div><div class="names">';
      for (var p = 0; p < res.groups[g].length; p++){
        html += '<span>' + res.groups[g][p].replace(/[<>&]/g, function(c){ return {'<':'&lt;','>':'&gt;','&':'&amp;'}[c]; }) + '</span>';
      }
      html += '</div></div>';
    }
    html += '</div>';
    $('res').innerHTML = html;
  }

  function run(){
    var all = parseNames();
    if (all.length < 2){ alert('名单至少要有两个人'); return; }
    var n = Math.max(1, Math.min(50, parseInt($('n').value, 10) || 1));

    if (mode === 'draw'){
      var k = Math.min(n, all.length);
      var pool = all.slice();
      shuffle(pool);
      var drawn = pool.slice(0, k);
      var prev = (last && last.drawNo) ? last.drawNo : 0;
      render({ all: all, drawn: drawn, drawNo: prev + 1 });
      $('modeTxt').textContent = '抽 ' + k + ' 个';
      return;
    }

    var groups = [], sizes = [];
    var pool2 = shuffle(all.slice());
    if (mode === 'byGroups'){
      var g = Math.min(n, all.length);
      var base = Math.floor(all.length / g), extra = all.length % g;
      var idx = 0;
      for (var i = 0; i < g; i++){
        var take = base + (i < extra ? 1 : 0);
        groups.push(pool2.slice(idx, idx + take));
        sizes.push(take);
        idx += take;
      }
      $('modeTxt').textContent = '分 ' + g + ' 组';
    } else {
      var per = Math.max(1, n);
      for (var j = 0; j < pool2.length; j += per){
        groups.push(pool2.slice(j, j + per));
        sizes.push(groups[groups.length - 1].length);
      }
      $('modeTxt').textContent = '每组 ' + per + ' 人';
    }
    render({ all: all, groups: groups, sizes: sizes });
  }

  $('modes').addEventListener('click', function(e){
    var b = e.target.closest ? e.target.closest('button[data-mode]') : null;
    if (!b) return;
    mode = b.getAttribute('data-mode');
    var all = this.querySelectorAll('button');
    for (var i = 0; i < all.length; i++) all[i].classList.toggle('on', all[i] === b);
    if (mode === 'draw'){
      $('nLab').textContent = '抽几个';
      $('nUnit').textContent = '个';
      $('n').value = 1;
    } else if (mode === 'bySize'){
      $('nLab').textContent = '每组';
      $('nUnit').textContent = '人';
      $('n').value = 4;
    } else {
      $('nLab').textContent = '分几组';
      $('nUnit').textContent = '组';
      $('n').value = 3;
    }
    last = null;
    $('modeTxt').textContent = mode === 'draw' ? '抽签' : (mode === 'bySize' ? '每组几人' : '分几组');
    render(null);
  });

  $('go').addEventListener('click', function(){ if (mode === 'draw') last = null; run(); });
  $('again').addEventListener('click', function(){ if (mode === 'draw') last = null; run(); });
  $('copy').addEventListener('click', function(){
    if (!last) return;
    var txt = '';
    if (mode === 'draw'){
      txt = '抽中：' + last.drawn.join('、');
    } else {
      for (var i = 0; i < last.groups.length; i++) txt += '第 ' + (i + 1) + ' 组：' + last.groups[i].join('、') + '\n';
      txt = txt.replace(/\n$/, '');
    }
    copyText(txt, $('copy'), '复制结果');
  });
  $('names').addEventListener('input', updateCount);
  $('n').addEventListener('keydown', function(e){ if (e.key === 'Enter') run(); });

  updateCount();
  run();
})();
</script>

.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
