<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>九宫格切图 · 一张图切成九张，发朋友圈正好</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .grid2{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:880px){ .grid2{grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start} }
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft);
      border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .bd{padding:13px}
  #drop{display:block; border:2px dashed var(--line); border-radius:var(--radius); padding:16px 14px;
        text-align:center; cursor:pointer; color:var(--dim); font-size:13px; transition:border-color .12s, background .12s}
  #drop b{color:var(--fg)}
  #drop:hover, #drop.over{border-color:var(--accent); background:var(--soft)}
  #stage{position:relative; margin-top:12px; border-radius:10px; overflow:hidden; background:var(--bg);
         display:flex; justify-content:center; padding:6px}
  #stage canvas{max-width:100%; max-height:430px; display:block; border-radius:5px}
  .opts{display:flex; flex-wrap:wrap; gap:9px 14px; align-items:center; margin-top:13px; font-size:13px; color:var(--dim)}
  .opts label{display:flex; align-items:center; gap:6px; white-space:nowrap}
  select{border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:8px; padding:5px 8px; font:13px/1.4 inherit}
  .go{display:flex; gap:9px; align-items:center; margin-top:13px; flex-wrap:wrap}
  .primary{border:0; border-radius:9px; background:var(--accent); color:var(--accent-fg); font:600 14px/1 inherit;
           padding:10px 17px; cursor:pointer; text-decoration:none; display:inline-block}
  .primary:disabled{opacity:.5; cursor:default}
  #stat{font-size:12.5px; color:var(--dim)}
  #stat.ok{color:var(--ok)} #stat.bad{color:var(--err)}
  #tiles{display:grid; grid-template-columns:repeat(3, 1fr); gap:6px; margin-top:12px}
  #tiles figure{margin:0; border:1px solid var(--line); border-radius:6px; overflow:hidden; background:var(--bg); position:relative}
  #tiles img{display:block; width:100%; height:auto}
  #tiles figcaption{font-size:10.5px; color:var(--dim); text-align:center; padding:2px 0 3px}
  .tip{font-size:12.5px; color:var(--dim); line-height:1.85; margin:13px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>九宫格切图</h1>
      <p class="lede">一张图平均切成 3×3 九张，打包下载，按顺序发出去就是完整画面；不上传。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="grid2">
    <div class="box">
      <div class="hd"><span>原图</span><span id="info">示例图 900×900</span></div>
      <div class="bd">
        <label id="drop" for="pick"><b>拖一张图进来</b>，或点这里选文件（JPG / PNG，方形图效果最好）</label>
        <input id="pick" type="file" accept="image/*" hidden>
        <div id="stage"><canvas id="cv" width="900" height="900"></canvas></div>
        <div class="opts">
          <label>切法
            <select id="mode">
              <option value="3x3" selected>3×3 九宫格</option>
              <option value="2x2">2×2 四格</option>
              <option value="1x3">1×3 竖着三条</option>
              <option value="3x1">3×1 横着三条</option>
              <option value="2x3">2 列 × 3 行</option>
              <option value="3x2">3 列 × 2 行</option>
            </select>
          </label>
          <label>单张边长
            <select id="cap">
              <option value="1080" selected>最多 1080（发朋友圈够）</option>
              <option value="1440">最多 1440</option>
              <option value="0">按原图切，不缩</option>
            </select>
          </label>
        </div>
        <div class="go">
          <button class="primary" id="bGo" type="button">切好打包</button>
          <a class="primary" id="dl" href="#" download="grid.zip" style="display:none">下载 ZIP</a>
          <span id="stat"></span>
        </div>
      </div>
    </div>

    <div class="box">
      <div class="hd"><span>切开的样子</span><span id="meta">—</span></div>
      <div class="bd">
        <div id="tiles"></div>
        <p class="tip" id="emptyTip">
          <b>怎么用</b>：左边默认放了一张示例图，点「切好打包」就能看到效果。<br>
          发九宫格时按 1→9 的顺序选图，安卓和 iOS 的相册默认都按文件名排。
        </p>
      </div>
    </div>
  </div>

  <p class="hint">
    <b>为什么切出来有接缝</b>：社交平台会自己在每张图之间留白，所以预览里能看到的缝是正常的，九张拼回去还是原图。<br>
    <b>边长怎么选</b>：九宫格每张显示大概 400 像素宽，1080 足够；要打印或再放大就选 1440 或原图。
  </p>

  <footer>纯本地处理，不上传。</footer>
</div>

<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var cv = $('cv'), ctx = cv.getContext('2d');
  var srcImg = null, srcName = 'grid';

  // 示例图：渐变底 + 大号序号，一眼看出九张拼起来是完整画面
  function drawDemo(){
    var w = 900, h = 900;
    cv.width = w; cv.height = h;
    var g = ctx.createLinearGradient(0, 0, w, h);
    g.addColorStop(0, '#2f6df6');
    g.addColorStop(.5, '#7b4df0');
    g.addColorStop(1, '#f0603f');
    ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 3;
    for (var i = 1; i < 3; i++){
      ctx.beginPath(); ctx.moveTo(w*i/3, 0); ctx.lineTo(w*i/3, h); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, h*i/3); ctx.lineTo(w, h*i/3); ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.font = '600 96px MiSans, "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    var n = 1;
    for (var r = 0; r < 3; r++) for (var c = 0; c < 3; c++){
      ctx.fillText(String(n++), w*(c + .5)/3, h*(r + .5)/3);
    }
    srcImg = null;
    $('info').textContent = '示例图 900×900';
    srcName = 'demo';
  }

  function drawOverlay(){
    var mode = $('mode').value.split('x');
    var cols = +mode[0], rows = +mode[1];
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,.85)';
    ctx.lineWidth = Math.max(2, cv.width / 320);
    ctx.setLineDash([cv.width/60, cv.width/90]);
    for (var i = 1; i < cols; i++){
      ctx.beginPath(); ctx.moveTo(cv.width*i/cols, 0); ctx.lineTo(cv.width*i/cols, cv.height); ctx.stroke();
    }
    for (var j = 1; j < rows; j++){
      ctx.beginPath(); ctx.moveTo(0, cv.height*j/rows); ctx.lineTo(cv.width, cv.height*j/rows); ctx.stroke();
    }
    ctx.restore();
    $('info').textContent = (srcImg ? srcName + ' ' : '示例图 ') + cv.width + '×' + cv.height;
  }

  function redraw(){
    if (!srcImg){ drawDemo(); drawOverlay(); return; }
    var maxW = 1400;
    var k = Math.min(1, maxW / Math.max(srcImg.naturalWidth, srcImg.naturalHeight));
    cv.width = Math.round(srcImg.naturalWidth * k);
    cv.height = Math.round(srcImg.naturalHeight * k);
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height);
    ctx.drawImage(srcImg, 0, 0, cv.width, cv.height);
    drawOverlay();
  }

  $('drop').addEventListener('dragover', function(e){ e.preventDefault(); this.classList.add('over'); });
  $('drop').addEventListener('dragleave', function(){ this.classList.remove('over'); });
  $('drop').addEventListener('drop', function(e){
    e.preventDefault(); this.classList.remove('over');
    var f = e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) openFile(f);
  });
  $('pick').addEventListener('change', function(){
    if (this.files && this.files[0]) openFile(this.files[0]);
    this.value = '';
  });

  function openFile(f){
    if (!/^image\//.test(f.type)){ $('stat').textContent = '这不是图片'; $('stat').className = 'bad'; return; }
    var img = new Image();
    img.onload = function(){
      srcImg = img;
      srcName = f.name.replace(/\.[^.]+$/, '').slice(0, 24) || 'grid';
      redraw();
      $('stat').textContent = '';
      $('tiles').innerHTML = '';
      $('dl').style.display = 'none';
      $('meta').textContent = '—';
    };
    img.src = URL.createObjectURL(f);
  }

  $('mode').addEventListener('change', function(){ if (!srcImg) drawDemo(); drawOverlay(); });

  // ---------- 切图 ----------
  function tileCanvas(sx, sy, sw, sh, scale){
    var tw = Math.max(1, Math.round(sw * scale)), th = Math.max(1, Math.round(sh * scale));
    var c = document.createElement('canvas');
    c.width = tw; c.height = th;
    var g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, tw, th);
    g.imageSmoothingQuality = 'high';
    g.drawImage(cv, sx, sy, sw, sh, 0, 0, tw, th);
    return c;
  }

  function canvasToBytes(c){
    return new Promise(function(resolve){
      c.toBlob(function(b){
        var fr = new FileReader();
        fr.onload = function(){ resolve(new Uint8Array(fr.result)); };
        fr.readAsArrayBuffer(b);
      }, 'image/png');
    });
  }

  // ---------- ZIP（只存储，不压缩；PNG 本身已压过） ----------
  var CRCT = (function(){
    var t = new Int32Array(256);
    for (var n = 0; n < 256; n++){
      var c = n;
      for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c;
    }
    return t;
  })();
  function crc32(u8){
    var c = -1;
    for (var i = 0; i < u8.length; i++) c = (c >>> 8) ^ CRCT[(c ^ u8[i]) & 255];
    return (c ^ -1) >>> 0;
  }
  function zipStore(entries){
    var parts = [], central = [], offset = 0, total = 0;
    function u16(v){ return [v & 255, (v >>> 8) & 255]; }
    function u32(v){ return [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255]; }

    entries.forEach(function(e){
      var nameB = new TextEncoder().encode(e.name);
      var crc = crc32(e.data);
      var head = [].concat(u32(0x04034b50), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                            u32(crc), u32(e.data.length), u32(e.data.length),
                            u16(nameB.length), u16(0));
      var headB = new Uint8Array(head);
      parts.push(headB, nameB, e.data);
      central.push({ name: nameB, crc: crc, size: e.data.length, offset: offset });
      offset += headB.length + nameB.length + e.data.length;
      total += headB.length + nameB.length + e.data.length;
    });

    var cdStart = total, cdSize = 0, cdParts = [];
    central.forEach(function(c){
      var rec = [].concat(u32(0x02014b50), u16(20), u16(20), u16(0x0800), u16(0), u16(0), u16(0),
                         u32(c.crc), u32(c.size), u32(c.size),
                         u16(c.name.length), u16(0), u16(0), u16(0), u16(0),
                         u32(0), u32(c.offset));
      var recB = new Uint8Array(rec);
      cdParts.push(recB, c.name);
      cdSize += recB.length + c.name.length;
    });
    var eocd = new Uint8Array([].concat(u32(0x06054b50), u16(0), u16(0), u16(central.length), u16(central.length),
                                     u32(cdSize), u32(cdStart), u16(0)));
    return new Blob(parts.concat(cdParts, [eocd]), { type: 'application/zip' });
  }

  $('bGo').onclick = async function(){
    var btn = this, stat = $('stat');
    stat.className = '';
    var mode = $('mode').value.split('x');
    var cols = +mode[0], rows = +mode[1];
    btn.disabled = true;
    try {
      var cap = +$('cap').value;
      var tw0 = cv.width / cols, th0 = cv.height / rows;
      var scale = cap ? Math.min(1, cap / Math.max(tw0, th0)) : 1;
      var entries = [], previews = [];
      var n = 1;
      for (var r = 0; r < rows; r++){
        for (var c = 0; c < cols; c++){
          stat.textContent = '正在切第 ' + n + ' / ' + (cols*rows) + ' 张…';
          var sx = cv.width * c / cols, sy = cv.height * r / rows;
          var tc = tileCanvas(sx, sy, tw0, th0, scale);
          var bytes = await canvasToBytes(tc);
          var name = srcName + '-' + String(n).padStart(2, '0') + '.png';
          entries.push({ name: name, data: bytes });
          previews.push({ url: URL.createObjectURL(new Blob([bytes], {type:'image/png'})), name: n, w: tc.width, h: tc.height });
          n++;
        }
      }
      var blob = zipStore(entries);
      var url = URL.createObjectURL(blob);
      var dl = $('dl');
      dl.href = url;
      dl.setAttribute('download', srcName + '-' + cols + 'x' + rows + '.zip');
      dl.style.display = 'inline-block';

      var box = $('tiles'); box.innerHTML = '';
      previews.forEach(function(p){
        var fig = document.createElement('figure');
        var im = document.createElement('img'); im.src = p.url; im.alt = p.name;
        var cap2 = document.createElement('figcaption'); cap2.textContent = p.name + ' · ' + p.w + '×' + p.h;
        fig.appendChild(im); fig.appendChild(cap2);
        box.appendChild(fig);
      });
      $('emptyTip').style.display = 'none';
      $('meta').textContent = entries.length + ' 张 · ' + (blob.size/1048576).toFixed(2) + ' MB';
      stat.textContent = '切好了，点「下载 ZIP」';
      stat.className = 'ok';
    } catch (e){
      stat.textContent = '出错：' + e.message;
      stat.className = 'bad';
    } finally {
      btn.disabled = false;
    }
  };

  drawDemo();
  drawOverlay();
})();
</script>

<a class="tb-nav" href="../" title="回到工具台">⌂ 工具台</a>
<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
