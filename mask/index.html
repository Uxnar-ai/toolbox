<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文本脱敏</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); min-width:0}
  .box h2{
    margin:0; padding:8px 12px; font-size:12.5px; font-weight:600; letter-spacing:.3px;
    color:var(--dim); border-bottom:1px solid var(--line); background:var(--soft);
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .box .pad{padding:12px}
  .panes{display:grid; gap:12px}
  @media (min-width:900px){ .panes{grid-template-columns:1fr 1fr; align-items:start} }
  textarea{
    width:100%; box-sizing:border-box; height:250px; min-height:130px; resize:vertical; padding:11px;
    border-radius:9px; border:1px solid var(--line2, var(--line)); background:var(--card);
    color:var(--fg); font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  .pills{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .pill{
    padding:5px 11px; border-radius:999px; border:1px solid var(--line2, var(--line));
    background:transparent; color:var(--dim); font:600 12.5px/1 inherit; cursor:pointer;
  }
  .pill.on{background:var(--accent); color:var(--accent-fg); border-color:var(--accent)}
  .pill.style{border-style:dashed}
  .result{
    border:1px solid var(--line); border-radius:9px; background:var(--soft); padding:11px;
    font:12.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; color:var(--fg);
    white-space:pre-wrap; word-break:break-all; height:250px; overflow:auto; box-sizing:border-box;
  }
  .result mark{
    background:color-mix(in srgb, var(--accent) 22%, transparent);
    color:var(--fg); border-radius:3px; padding:0 2px;
  }
  .stats{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; min-height:20px}
  .stats span{font-size:11.5px; color:var(--dim); background:var(--soft); border-radius:999px; padding:2px 9px}
  .stats span b{color:var(--accent)}
  .toolbar{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .toolbar button{
    padding:5px 11px; border-radius:999px; border:1px solid var(--line2, var(--line));
    background:transparent; color:var(--fg); font:600 12.5px/1 inherit; cursor:pointer;
  }
  .toolbar button:hover{border-color:var(--accent); color:var(--accent)}
  .hint{font-size:12px; color:var(--dim); margin:10px 0 0; line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>文本脱敏</h1>
      <p class="lede">把日志发给别人之前，先把手机号、邮箱、身份证、卡号遮掉——粘进来就改好。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="panes">
    <div class="box">
      <h2><span>原始文本</span><span id="insize">—</span></h2>
      <div class="pad">
        <textarea id="src" spellcheck="false" placeholder="把日志、报错、聊天记录粘进来"></textarea>
        <div class="pills" id="rules"></div>
        <div class="pills">
          <button class="pill style" id="style" type="button">保留首尾</button>
          <button class="pill" id="reset" type="button">换回示例</button>
        </div>
      </div>
    </div>

    <div class="box">
      <h2><span>脱敏结果</span><span id="outsize">—</span></h2>
      <div class="pad">
        <div class="result" id="out"></div>
        <div class="stats" id="stats"></div>
        <div class="toolbar">
          <button id="copy" type="button">复制结果</button>
          <button id="clear" type="button">清空</button>
        </div>
        <p class="hint">遮掉的地方会标出来。默认保留首尾几位、方便对方核对，切换成「整段打码」就只剩星号。</p>
      </div>
    </div>
  </div>

  <footer>全在浏览器里算，内容不上传。规则是正则，够用就好，不要拿它当合规工具。</footer>
</div>

<script src="../assets/base.js"></script>
<script>
(function(){
  var src = document.getElementById('src'), out = document.getElementById('out'),
      stats = document.getElementById('stats'), rulesBox = document.getElementById('rules'),
      styleBtn = document.getElementById('style'), copyBtn = document.getElementById('copy'),
      insize = document.getElementById('insize'), outsize = document.getElementById('outsize');

  var SAMPLE = [
    '2026-11-07 03:12:01 INFO  登录成功 email=zhang.wei@example.com ip=203.0.113.24 tel=13812345678',
    '2026-11-07 03:12:09 WARN  支付回调 card=6222021234567890123 amount=299.00',
    '2026-11-07 03:13:44 ERROR 重试失败 id=110101199003071234 token=9f2c8e14a7b34d10b6e05f9a3c7d2188',
    '2026-11-07 03:14:02 INFO  客服备注：客户手机 13900001111，邮箱 service@shop-example.cn'
  ].join('\n');

  var RULES = [
    {id: 'id',    name: '身份证', re: /\b\d{17}[\dXx]\b|\b\d{15}\b/g,                  keep: [6, 4], on: true},
    {id: 'card',  name: '银行卡', re: /\b\d{16,19}\b/g,                                 keep: [4, 4], on: true},
    {id: 'phone', name: '手机号', re: /(?<!\d)1[3-9]\d{9}(?!\d)/g,                      keep: [3, 4], on: true},
    {id: 'mail',  name: '邮箱',   re: /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, keep: 'mail',  on: true},
    {id: 'ip',    name: 'IP 地址', re: /\b(?:\d{1,3}\.){3}\d{1,3}\b/g,                   keep: 'ip', on: true},
    {id: 'token', name: '长串密钥', re: /(?<![A-Za-z0-9])[A-Za-z0-9_-]{28,}(?![A-Za-z0-9])/g, keep: [4, 0], on: true}
  ];

  var keepStyle = true;   // true：保留首尾（138****1234）；false：整段打码

  function esc(s){
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function maskOne(rule, text){
    var n = text.length;
    if (!keepStyle) return new Array(Math.min(Math.max(n, 4), 12) + 1).join('*');
    if (rule.keep === 'mail'){
      var at = text.indexOf('@');
      var local = text.slice(0, at), domain = text.slice(at);
      if (local.length <= 2) return local.slice(0, 1) + '***' + domain;
      return local.slice(0, 1) + new Array(Math.min(Math.max(local.length - 1, 3), 6) + 1).join('*') + domain;
    }
    // 网段保留前两段，同一内网的人还能看出是不是一个网段
    if (rule.keep === 'ip'){
      var p = text.split('.');
      return p[0] + '.' + p[1] + '.*.*';
    }
    var head = rule.keep[0], tail = rule.keep[1];
    if (n <= head + tail + 2) return new Array(n + 1).join('*');
    var stars = Math.min(n - head - tail, 12);
    return text.slice(0, head) + new Array(stars + 1).join('*') + (tail ? text.slice(n - tail) : '');
  }

  function compute(){
    var s = src.value;
    var accepted = [];
    RULES.forEach(function(rule){
      if (!rule.on) return;
      rule.re.lastIndex = 0;
      var m;
      while ((m = rule.re.exec(s))){
        if (!m[0].length){ rule.re.lastIndex++; continue; }
        var a = m.index, b = a + m[0].length, hit = false;
        for (var i = 0; i < accepted.length; i++){
          if (a < accepted[i].end && b > accepted[i].start){ hit = true; break; }
        }
        if (!hit) accepted.push({start: a, end: b, text: m[0], rule: rule});
      }
    });
    accepted.sort(function(x, y){ return x.start - y.start; });
    return accepted;
  }

  function paint(){
    var s = src.value;
    var acc = compute();
    var html = '', plain = '', pos = 0, counts = {};

    acc.forEach(function(a){
      html += esc(s.slice(pos, a.start));
      plain += s.slice(pos, a.start);
      var masked = maskOne(a.rule, a.text);
      html += '<mark>' + esc(masked) + '</mark>';
      plain += masked;
      pos = a.end;
      counts[a.rule.name] = (counts[a.rule.name] || 0) + 1;
    });
    html += esc(s.slice(pos));
    plain += s.slice(pos);

    out.innerHTML = html || '<span style="color:var(--dim)">左边粘点东西，这里立刻出结果</span>';

    var bits = [];
    RULES.forEach(function(r){
      if (counts[r.name]) bits.push('<span>' + r.name + ' <b>' + counts[r.name] + '</b> 处</span>');
    });
    stats.innerHTML = bits.length ? bits.join('') : '<span>没找到敏感信息</span>';

    insize.textContent = s.length + ' 字';
    outsize.textContent = acc.length ? acc.length + ' 处已遮' : '—';
    copyBtn.disabled = false;
    copyBtn._plain = plain;
  }

  // 规则开关
  RULES.forEach(function(rule){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'pill' + (rule.on ? ' on' : '');
    b.textContent = rule.name;
    b.addEventListener('click', function(){
      rule.on = !rule.on;
      b.className = 'pill' + (rule.on ? ' on' : '');
      paint();
    });
    rulesBox.appendChild(b);
  });

  styleBtn.addEventListener('click', function(){
    keepStyle = !keepStyle;
    styleBtn.textContent = keepStyle ? '保留首尾' : '整段打码';
    styleBtn.className = 'pill style' + (keepStyle ? '' : ' on');
    paint();
  });

  src.addEventListener('input', paint);

  copyBtn.addEventListener('click', function(){
    copyText(copyBtn._plain || '', copyBtn, '复制结果');
  });

  document.getElementById('clear').addEventListener('click', function(){
    src.value = '';
    paint();
  });
  document.getElementById('reset').addEventListener('click', function(){
    src.value = SAMPLE;
    paint();
  });

  src.value = SAMPLE;
  paint();
})();
</script>

<a class="tb-nav" href="../" title="回到工具台">⌂ 工具台</a>
<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
