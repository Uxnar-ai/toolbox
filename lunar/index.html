<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>农历与节日 · 某天是农历几月几，还差几天过节</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .panes{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:860px){ .panes{grid-template-columns:320px 1fr; align-items:start} }
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft);
      border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .bd{padding:13px}
  .f{display:flex; flex-direction:column; gap:5px; margin-bottom:12px}
  .f label{font-size:12px; color:var(--dim)}
  .f input{font:13.5px/1.5 inherit; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
           background:var(--card); color:var(--fg); width:100%; min-width:0}
  .f input:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .big{padding:16px 15px 14px; border-bottom:1px solid var(--line)}
  .big .lead{font-size:12px; color:var(--dim); margin-bottom:6px}
  .big .num{font-size:30px; font-weight:600; line-height:1.25; letter-spacing:-.3px}
  .big .num em{font-style:normal; color:var(--accent)}
  .big .sub{font-size:12.5px; color:var(--dim); margin-top:7px; line-height:1.7}
  .cards{display:grid; gap:10px; grid-template-columns:1fr 1fr; padding:13px}
  @media (min-width:620px){ .cards{grid-template-columns:1fr 1fr 1fr} }
  .c{background:var(--soft); border-radius:10px; padding:11px 12px; min-width:0}
  .c .k{font-size:11.5px; color:var(--dim); margin-bottom:5px}
  .c .v{font-size:17px; font-weight:600; line-height:1.3; word-break:break-word}
  .c .v small{font-size:12px; font-weight:400; color:var(--dim); margin-left:3px}
  .c .n{font-size:11px; color:var(--dim); margin-top:4px; line-height:1.5}
  .seg{display:flex; gap:8px; flex-wrap:wrap; align-items:center}
  .fest{padding:0 13px 14px}
  .fest h3{font-size:12px; font-weight:600; color:var(--dim); margin:0 0 8px}
  .fest ul{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
  .fest li{display:flex; align-items:center; gap:10px; font-size:13px; padding:8px 11px;
           border:1px solid var(--line); border-radius:9px; background:var(--bg); min-width:0}
  .fest .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500}
  .fest .dt{flex:0 0 auto; color:var(--dim); font-variant-numeric:tabular-nums; font-size:12.5px}
  .fest .dd{flex:0 0 auto; width:66px; text-align:right; color:var(--accent); font-weight:600;
            font-variant-numeric:tabular-nums; font-size:12.5px}
  .hint{font-size:12.5px; color:var(--dim); line-height:1.85; margin:13px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>农历与节日</h1>
      <p class="lede">填一个日子，出农历几月几、干支和生肖，再算离下一个传统节日还有几天。</p>
    </div>
    <button class="toggle" id="theme">☀︎ / ☾</button>
  </header>

  <div class="panes">
    <div class="box">
      <div class="hd"><span>选日期</span><span id="state">今天</span></div>
      <div class="bd">
        <div class="f">
          <label>公历日期</label>
          <input type="date" id="d">
        </div>
        <div class="seg">
          <button class="chip" id="bToday" type="button">今天</button>
          <button class="chip" id="bNew" type="button">今年春节</button>
          <button class="chip" id="bNext" type="button">下个节日</button>
        </div>
      </div>
    </div>

    <div class="box">
      <div class="big">
        <div class="lead" id="lead">农历</div>
        <div class="num" id="main">—</div>
        <div class="sub" id="sub"></div>
      </div>
      <div class="cards" id="cards"></div>
      <div class="fest">
        <h3>接下来的三个传统节日</h3>
        <ul id="fl"></ul>
      </div>
    </div>
  </div>

  <p class="hint">
    <b>怎么算的</b>：按 1900–2099 年的农历表换算，闰月会写成「闰四月」，不会和正四月混；超出这个范围不显示。<br>
    <b>节日范围</b>：春节、元宵、龙抬头、端午、七夕、中秋、重阳、腊八、小年、除夕；除夕按腊月最后一天认。<br>
    <b>农历生日</b>：选公历日子只能看当天农历，要反查「农历某日是哪天」，往下挑节日就行。
  </p>

  <footer>纯本地计算，不上传。</footer>
</div>

<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var WEEK = ['日','一','二','三','四','五','六'];
  var ZHI = '子丑寅卯辰巳午未申酉戌亥'.split('');
  var ANIMAL = { '子':'鼠', '丑':'牛', '寅':'虎', '卯':'兔', '辰':'龙', '巳':'蛇',
                 '午':'马', '未':'羊', '申':'猴', '酉':'鸡', '戌':'狗', '亥':'猪' };
  var FEST = [[1,1,'春节'], [1,15,'元宵'], [2,2,'龙抬头'], [5,5,'端午'], [7,7,'七夕'],
              [8,15,'中秋'], [9,9,'重阳'], [12,8,'腊八'], [12,23,'小年']];

  // 1900–2099 年农历数据（每年一个数：低 4 位是闰月，中间 12 位是各月大小，最高位是闰月天数）
  var LUNAR_INFO = [
    0x4bd8,0x4ae0,0xa570,0x54d5,0xd260,0xd950,0x16554,0x56a0,0x9ad0,0x55d2,0x4ae0,0xa5b6,
    0xa4d0,0xd250,0x1d255,0xb540,0xd6a0,0xada2,0x95b0,0x14977,0x4970,0xa4b0,0xb4b5,0x6a50,
    0x6d40,0x1ab54,0x2b60,0x9570,0x52f2,0x4970,0x6566,0xd4a0,0xea50,0x6e95,0x5ad0,0x2b60,
    0x186e3,0x92e0,0x1c8d7,0xc950,0xd4a0,0x1d8a6,0xb550,0x56a0,0x1a5b4,0x25d0,0x92d0,0xd2b2,
    0xa950,0xb557,0x6ca0,0xb550,0x15355,0x4da0,0xa5d0,0x14573,0x52b0,0xa9a8,0xe950,0x6aa0,
    0xaea6,0xab50,0x4b60,0xaae4,0xa570,0x5260,0xf263,0xd950,0x5b57,0x56a0,0x96d0,0x4dd5,
    0x4ad0,0xa4d0,0xd4d4,0xd250,0xd558,0xb540,0xb5a0,0x195a6,0x95b0,0x49b0,0xa974,0xa4b0,
    0xb27a,0x6a50,0x6d40,0xaf46,0xab60,0x9570,0x4af5,0x4970,0x64b0,0x74a3,0xea50,0x6b58,
    0x5ac0,0xab60,0x96d5,0x92e0,0xc960,0xd954,0xd4a0,0xda50,0x7552,0x56a0,0xabb7,0x25d0,
    0x92d0,0xcab5,0xa950,0xb4a0,0xbaa4,0xad50,0x55d9,0x4ba0,0xa5b0,0x15176,0x52b0,0xa930,
    0x7954,0x6aa0,0xad50,0x5b52,0x4b60,0xa6e6,0xa4e0,0xd260,0xea65,0xd530,0x5aa0,0x76a3,
    0x96d0,0x4afb,0x4ad0,0xa4d0,0x1d0b6,0xd250,0xd520,0xdd45,0xb5a0,0x56d0,0x55b2,0x49b0,
    0xa577,0xa4b0,0xaa50,0x1b255,0x6d20,0xada0,0x14b63,0x9370,0x49f8,0x4970,0x64b0,0x168a6,
    0xea50,0x6aa0,0x1a6c4,0xaae0,0x92e0,0xd2e3,0xc960,0xd557,0xd4a0,0xda50,0x5d55,0x56a0,
    0xa6d0,0x55d4,0x52d0,0xa9b8,0xa950,0xb4a0,0xb6a6,0xad50,0x55a0,0xaba4,0xa5b0,0x52b0,
    0xb273,0x6930,0x7337,0x6aa0,0xad50,0x14b55,0x4b60,0xa570,0x54e4,0xd160,0xe968,0xd520,
    0xdaa0,0x16aa6,0x56d0,0x4ae0,0xa9d4,0xa2d0,0xd150,0xf252,
  ];
  function parse(s){
    if (!s) return null;
    var m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (!m) return null;
    var d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  function ymd(d){
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }
  function todayStr(){ var n = new Date(); return ymd(new Date(n.getFullYear(), n.getMonth(), n.getDate())); }
  function addDays(d, n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); }
  function dayDiff(a, b){ return Math.round((b - a) / 86400000); }

  var BASE = Date.UTC(1900, 0, 31);   // 1900 年正月初一
  var GAN = '甲乙丙丁戊己庚辛壬癸';
  var ymCache = {}, cache = {};

  function yearMonths(y){
    if (ymCache[y]) return ymCache[y];
    var info = LUNAR_INFO[y - 1900], leap = info & 0xf, out = [];
    for (var m = 1; m <= 12; m++){
      out.push({ m: m, leap: false, days: (info & (0x10000 >> m)) ? 30 : 29 });
      if (leap === m) out.push({ m: m, leap: true, days: (info & 0x10000) ? 30 : 29 });
    }
    ymCache[y] = out;
    return out;
  }
  function yearDays(y){
    var ms = yearMonths(y), s = 0;
    for (var i = 0; i < ms.length; i++) s += ms[i].days;
    return s;
  }

  function lunar(d){
    var k = ymd(d);
    if (cache[k] !== undefined) return cache[k];
    var offset = Math.round((Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) - BASE) / 86400000);
    var res = null;
    if (offset >= 0){
      var y = 1900;
      while (y < 2099 && offset >= yearDays(y)){ offset -= yearDays(y); y++; }
      if (y <= 2099){
        var ms = yearMonths(y), i = 0;
        while (i < ms.length - 1 && offset >= ms[i].days){ offset -= ms[i].days; i++; }
        if (offset < ms[i].days){
          res = {
            year: GAN.charAt((y - 4) % 10) + ZHI[(y - 4) % 12],
            month: ms[i].m, leap: ms[i].leap, day: offset + 1,
            label: (ms[i].leap ? '闰' : '') + monthName(ms[i].m) + cnDay(offset + 1)
          };
        }
      }
    }
    cache[k] = res;
    return res;
  }

  function cnDay(n){
    if (n <= 0) return '';
    if (n <= 10) return '初' + '一二三四五六七八九十'.charAt(n - 1);
    if (n < 20) return '十' + '一二三四五六七八九'.charAt(n - 11);
    if (n === 20) return '二十';
    if (n < 30) return '廿' + '一二三四五六七八九'.charAt(n - 21);
    return '三十';
  }

  function sign(m, d){
    var cuts = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
    var names = ['摩羯','水瓶','双鱼','白羊','金牛','双子','巨蟹','狮子','处女','天秤','天蝎','射手','摩羯'];
    return names[d < cuts[m - 1] ? m - 1 : m];
  }

  // 找出从现在起最近的一个传统节日（含除夕）
  function nextFests(from, limit){
    var res = [], guard = 0, d = addDays(from, 0);
    while (res.length < limit && guard < 500){
      var l = lunar(d);
      if (l){
        for (var i = 0; i < FEST.length; i++){
          if (l.month === FEST[i][0] && l.day === FEST[i][1] && !l.leap){
            res.push({ name: FEST[i][2], date: new Date(d), lunar: l.label });
            break;
          }
        }
        if (res.length && res[res.length - 1].date.getTime() === d.getTime()){ d = addDays(d, 1); guard++; continue; }
        var nx = lunar(addDays(d, 1));
        if (l.month === 12 && nx && nx.month === 1 && nx.day === 1 && !l.leap){
          res.push({ name: '除夕', date: new Date(d), lunar: l.label });
        }
      }
      d = addDays(d, 1); guard++;
    }
    return res;
  }

  function card(k, v, n){
    return '<div class="c"><div class="k">' + k + '</div><div class="v">' + v + '</div>' +
           (n ? '<div class="n">' + n + '</div>' : '') + '</div>';
  }

  var lastList = [];

  function run(){
    var d = parse($('d').value);
    if (!d){ $('main').textContent = '—'; $('sub').textContent = '选一个日期'; return; }
    var l = lunar(d);
    if (!l){
      $('main').textContent = '浏览器不支持';
      $('sub').textContent = '这个浏览器没有内置中文历法，换 Chrome / Edge 试试。';
      return;
    }
    var today = parse(todayStr());
    var branch = l.year.charAt(1);
    var animal = ANIMAL[branch] || '';

    $('main').innerHTML = (l.leap ? '闰' : '') + monthName(l.month) + cnDay(l.day) +
      '<em> ' + l.year + '年</em>';
    var gap = dayDiff(today, d);
    $('sub').textContent = ymd(d) + ' 星期' + WEEK[d.getDay()] +
      (gap === 0 ? '　·　就是今天' : (gap > 0 ? '　·　今天之后第 ' + gap + ' 天' : '　·　' + (-gap) + ' 天前'));

    var list = nextFests(d, 3);
    lastList = list;
    var first = list[0];

    $('cards').innerHTML =
      card('干支年', l.year || '—', '立春分界，不是元旦') +
      card('生肖', animal, ANIMAL[branch] ? '按农历年（' + l.year + '）' : '') +
      card('农历月', (l.leap ? '闰' : '') + monthName(l.month), l.leap ? '这个月是闰月' : '') +
      card('星期', '星期' + WEEK[d.getDay()], '') +
      card('下一个节日', first ? first.name : '—',
           first ? dayDiff(d, first.date) + ' 天后（' + ymd(first.date) + '）' : '') +
      card('星座', sign(d.getMonth() + 1, d.getDate()), '');

    $('fl').innerHTML = list.map(function(f){
      var n = dayDiff(d, f.date);
      return '<li><span class="nm">' + f.name + '</span>' +
             '<span class="dt">' + ymd(f.date) + ' · ' + f.lunar + '</span>' +
             '<span class="dd">' + (n === 0 ? '就是这天' : n + ' 天后') + '</span></li>';
    }).join('');

    $('state').textContent = ymd(d) === todayStr() ? '今天' : ymd(d);
  }

  function monthName(m){
    return ['', '正月', '二月', '三月', '四月', '五月', '六月',
            '七月', '八月', '九月', '十月', '冬月', '腊月'][m] || '';
  }

  $('d').addEventListener('input', run);
  $('bToday').addEventListener('click', function(){ $('d').value = todayStr(); run(); });

  // 今年春节：从今年 1 月 1 日开始找第一个正月初一
  $('bNew').addEventListener('click', function(){
    var y = new Date().getFullYear(), d = new Date(y, 0, 1);
    for (var i = 0; i < 90; i++){
      var l = lunar(addDays(d, i));
      if (l && l.month === 1 && l.day === 1 && !l.leap){ $('d').value = ymd(addDays(d, i)); run(); return; }
    }
  });
  $('bNext').addEventListener('click', function(){
    var list = nextFests(parse(todayStr()), 4);
    var t = parse(todayStr()).getTime();
    for (var i = 0; i < list.length; i++){
      if (list[i].date.getTime() > t){ $('d').value = ymd(list[i].date); run(); return; }
    }
  });

  $('d').value = todayStr();
  run();
})();
</script>

  position:fixed; left:14px; bottom:14px; z-index:999;

  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
