<!DOCTYPE html>
<html lang="zh-CN" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XML 整理与转换 · 排版 / 压一行 / 转 JSON</title>
<link rel="icon" type="image/svg+xml" href="../assets/icon.svg">
<meta name="theme-color" content="#f6f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="../assets/theme.css">
<style>
  .panes{display:grid; gap:14px; grid-template-columns:1fr}
  @media (min-width:900px){ .panes{grid-template-columns:minmax(0,1fr) minmax(0,1fr); align-items:start} }
  .box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden}
  .hd{padding:9px 13px; font-size:12.5px; font-weight:600; color:var(--dim); background:var(--soft);
      border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:8px; align-items:center}
  .hd .sp{flex:1 1 auto}
  .bd{padding:12px 13px}
  textarea{
    width:100%; height:420px; resize:vertical; padding:11px 12px; border-radius:9px;
    border:1px solid var(--line); background:var(--bg); color:var(--fg);
    font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace; tab-size:2
  }
  textarea:focus{outline:2px solid var(--accent); outline-offset:-1px}
  .chips{display:flex; gap:6px; padding:10px 13px 0; flex-wrap:wrap}
  .chips button{
    font:12.5px/1 inherit; padding:8px 13px; border-radius:999px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--dim)
  }
  .chips button.on{border-color:var(--accent); background:var(--soft); color:var(--accent); font-weight:600}
  .chips button:hover{border-color:var(--accent)}
  pre.out{
    margin:12px 13px 0; height:380px; overflow:auto; padding:12px; border-radius:9px;
    background:var(--bg); border:1px solid var(--line); white-space:pre; tab-size:2;
    font:12.5px/1.7 ui-monospace,Menlo,Consolas,monospace; color:var(--fg)
  }
  .tools{display:flex; gap:8px; flex-wrap:wrap; padding:11px 13px 13px}
  button.act{
    font:500 13px/1 inherit; padding:9px 14px; border-radius:8px; cursor:pointer;
    border:1px solid var(--accent); background:var(--accent); color:var(--accent-fg)
  }
  button.act:disabled{opacity:.45; cursor:not-allowed}
  button.ghost{
    font:13px/1 inherit; padding:9px 13px; border-radius:8px; cursor:pointer;
    border:1px solid var(--line); background:var(--card); color:var(--fg)
  }
  button.ghost:hover{border-color:var(--accent)}
  .stat{padding:0 14px 12px; font-size:12.5px; color:var(--dim); line-height:1.75}
  .stat b{color:var(--fg); font-weight:600}
  .stat .e{color:var(--err)}
  .hint{font-size:12.5px; color:var(--dim); line-height:1.85; margin:14px 0 0}
  .hint b{color:var(--fg)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>XML 整理与转换</h1>
      <p class="lede">粘一段 XML：排好版、压成一行、或者变成 JSON，左边改右边立刻跟着变。</p>
    </div>
    <button class="toggle" id="theme">跟随系统</button>
  </header>

  <div class="panes">
    <div class="box">
      <div class="hd">
        <span>XML</span><span class="sp"></span>
        <button class="ghost" id="bDemo" style="padding:4px 10px;font-size:12px">换回示例</button>
        <button class="ghost" id="bClear" style="padding:4px 10px;font-size:12px">清空</button>
      </div>
      <div class="bd">
        <textarea id="src" spellcheck="false" placeholder="&lt;root&gt;&lt;a id=&quot;1&quot;&gt;第一项&lt;/a&gt;&lt;/root&gt;"></textarea>
      </div>
    </div>

    <div class="box">
      <div class="hd"><span>结果</span><span id="size">—</span></div>
      <div class="chips" id="modes">
        <button data-m="pretty" class="on">排好版</button>
        <button data-m="min">压成一行</button>
        <button data-m="json">转 JSON</button>
      </div>
      <pre class="out" id="out"></pre>
      <div class="tools">
        <button class="act" id="bCopy" disabled>复制结果</button>
        <button class="ghost" id="bDown" disabled>下载</button>
      </div>
      <div class="stat" id="stat">在本地解析，不上传。</div>
    </div>
  </div>

  <p class="hint">
    <b>说明</b>：压缩只吃掉标签之间的空白，正文里的空格原样留着；注释会一起保留。
    转 JSON 时属性前加 <b>@</b>（`@id`），元素里的文字放在 <b>#text</b>，同名兄弟元素自动变成数组 —— 值一律按字符串给，避免 `1.10` 被当成 1.1。
  </p>
</div>

<script>
var DEMO_XML = [
  '<config xmlns="http://example.com/schema" env="prod">',
  '  <!-- 示例：一个服务配置 -->',
  '  <server host="198.51.100.10" port="8080">',
  '    <timeout read="30" write="10"/>',
  '    <cors allow="https://example.com" methods="GET,POST"/>',
  '  </server>',
  '  <rules>',
  '    <rule id="r1" enabled="true"><match path="/api/**"/><limit qps="120"/></rule>',
  '    <rule id="r2" enabled="false"><match path="/admin/**"/><limit qps="20"/></rule>',
  '  </rules>',
  '  <note><![CDATA[路径里的 < 和 & 不用转义]]></note>',
  '</config>'
].join('\n');
</script>

<script src="../assets/base.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var srcEl = $('src'), out = $('out'), stat = $('stat'), sizeEl = $('size');
  var bCopy = $('bCopy'), bDown = $('bDown');
  var mode = 'pretty', timer = null, result = '';

  function esc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function attrEsc(s){ return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }

  function parseErr(text){
    var raw = String(text).replace(/\s+/g, ' ').trim();
    var m = raw.match(/error on line (\d+) at column (\d+):\s*([\s\S]*?)(?:Below is a rendering|$)/i);
    if (m) return '第 ' + m[1] + ' 行第 ' + m[2] + ' 列 · ' + (m[3] || '').trim().slice(0, 90);
    return raw.replace(/^This page contains the following errors:?/i, '').slice(0, 120);
  }

  function parse(src){
    var doc = new DOMParser().parseFromString(src, 'application/xml');
    var pe = doc.getElementsByTagName('parsererror')[0];
    if (pe) throw new Error('XML 有错 —— ' + parseErr(pe.textContent || ''));
    if (!doc.documentElement) throw new Error('没读到内容，检查是不是空的');
    return doc;
  }

  // ind 为空串就是压成一行
  function ser(node, ind, lvl){
    var NL = ind ? '\n' : '';
    var pad = function(n){ return ind ? new Array(n + 1).join(ind) : ''; };
    var t = node.nodeType;

    if (t === 9){
      var parts = [];
      for (var i = 0; i < node.childNodes.length; i++){
        var seg = ser(node.childNodes[i], ind, 0);
        if (seg) parts.push(seg);
      }
      return parts.join(NL);
    }
    if (t === 10) return '<!DOCTYPE ' + node.name + (node.publicId ? ' PUBLIC "' + node.publicId + '"' : '') +
                         (node.systemId ? ' "' + node.systemId + '"' : '') + '>';
    if (t === 7) return '<?' + node.target + (node.data ? ' ' + node.data : '') + '?>';
    if (t === 8) return '<!--' + node.nodeValue + '-->';
    if (t === 4) return '<![CDATA[' + node.nodeValue + ']]>';
    if (t === 3){
      var v = node.nodeValue;
      if (!v.trim()) return '';
      return ind ? pad(lvl) + esc(v.trim()) : esc(v);
    }
    if (t !== 1) return '';

    var tag = node.nodeName;
    var at = '';
    for (var k = 0; k < node.attributes.length; k++){
      var a = node.attributes[k];
      at += ' ' + a.name + '="' + attrEsc(a.value) + '"';
    }

    var kids = [], hasChildEl = false, textBuf = '';
    for (var j = 0; j < node.childNodes.length; j++){
      var c = node.childNodes[j];
      if (c.nodeType === 3){ textBuf += c.nodeValue; continue; }
      if (c.nodeType === 1) hasChildEl = true;
      kids.push(c);
    }

    if (!hasChildEl && !kids.length){
      var txt = textBuf.trim();
      return pad(lvl) + '<' + tag + at + '>' + (txt ? esc(txt) : '') + '</' + tag + '>';
    }
    // 只有文字 + 注释这类，也压成一行更紧凑
    if (!hasChildEl){
      var inline = kids.map(function(c){ return ser(c, '', 0); }).join('');
      var tx = textBuf.trim();
      return pad(lvl) + '<' + tag + at + '>' + (tx ? esc(tx) : '') + inline + '</' + tag + '>';
    }

    var lines = [];
    if (textBuf.trim()) lines.push(pad(lvl + 1) + esc(textBuf.trim()));
    for (var q = 0; q < node.childNodes.length; q++){
      var seg2 = ser(node.childNodes[q], ind, lvl + 1);
      if (seg2) lines.push(seg2);
    }
    var head = pad(lvl) + '<' + tag + at + '>' + NL;
    return head + lines.join(NL) + NL + pad(lvl) + '</' + tag + '>';
  }

  function toObj(el){
    var o = {}, i, k;
    var kids = [], text = '';
    for (i = 0; i < el.childNodes.length; i++){
      var c = el.childNodes[i];
      if (c.nodeType === 1) kids.push(c);
      else if (c.nodeType === 3) text += c.nodeValue;
      else if (c.nodeType === 4) text += c.nodeValue;
    }
    var hasAttr = el.attributes && el.attributes.length > 0;
    var t = text.trim();

    if (!hasAttr && !kids.length){
      if (/^[+-]?\d+(\.\d+)?$/.test(t)) return t;   // 保持字符串，统一类型
      return t;
    }
    for (i = 0; i < el.attributes.length; i++){
      k = el.attributes[i];
      o['@' + k.name] = k.value;
    }
    for (i = 0; i < kids.length; i++){
      var name = kids[i].nodeName;
      var val = toObj(kids[i]);
      if (Object.prototype.hasOwnProperty.call(o, name)){
        if (!Array.isArray(o[name])) o[name] = [o[name]];
        o[name].push(val);
      } else {
        o[name] = val;
      }
    }
    if (t && (hasAttr || kids.length)) o['#text'] = t;
    return o;
  }

  function run(){
    var src = srcEl.value.trim();
    bCopy.disabled = true; bDown.disabled = true;
    if (!src){
      out.textContent = '';
      sizeEl.textContent = '—';
      stat.textContent = '左边还空着';
      return;
    }
    var doc;
    try { doc = parse(src); }
    catch (e){
      out.textContent = '';
      sizeEl.textContent = '—';
      stat.innerHTML = '<span class="e">' + e.message.replace(/</g, '&lt;') + '</span>';
      return;
    }
    try {
      if (mode === 'pretty') result = ser(doc, '  ', 0).replace(/^\s+|\s+$/g, '');
      else if (mode === 'min') result = ser(doc, '', 0);
      else {
        var root = doc.documentElement;
        var obj = {};
        obj[root.nodeName] = toObj(root);
        result = JSON.stringify(obj, null, 2);
      }
    } catch (e){
      stat.innerHTML = '<span class="e">处理失败：' + e.message + '</span>';
      return;
    }
    out.textContent = result;
    bCopy.disabled = !result; bDown.disabled = !result;

    var before = src.length, after = result.length, lines = result.split('\n').length;
    sizeEl.textContent = lines + ' 行 · ' + after + ' 字符';
    var tail = mode === 'json' ? 'JSON' : (mode === 'min' ? '压成一行' : '排好版');
    stat.innerHTML = '<b>' + tail + '</b> · ' + before + ' → ' + after + ' 字符' +
      (mode === 'min' ? '（省 ' + Math.max(0, Math.round((1 - after / before) * 100)) + '%）' : '') +
      ' · 本地解析';
  }

  function schedule(){ clearTimeout(timer); timer = setTimeout(run, 220); }

  srcEl.value = DEMO_XML;
  run();

  srcEl.addEventListener('input', schedule);
  Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function(b){
    b.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('#modes button'), function(x){ x.classList.remove('on'); });
      b.classList.add('on');
      mode = b.dataset.m;
      run();
    });
  });

  $('bDemo').addEventListener('click', function(){
    srcEl.value = DEMO_XML;
    run();
  });
  $('bClear').addEventListener('click', function(){ srcEl.value = ''; run(); srcEl.focus(); });

  bCopy.addEventListener('click', function(){
    if (!result) return;
    navigator.clipboard.writeText(result).then(function(){
      bCopy.textContent = '已复制';
      setTimeout(function(){ bCopy.textContent = '复制结果'; }, 1300);
    }, function(){
      var ta = document.createElement('textarea');
      ta.value = result; document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e){}
      ta.remove();
      bCopy.textContent = '已复制';
      setTimeout(function(){ bCopy.textContent = '复制结果'; }, 1300);
    });
  });

  bDown.addEventListener('click', function(){
    if (!result) return;
    var ext = mode === 'json' ? 'json' : 'xml';
    var blob = new Blob([result], { type: mode === 'json' ? 'application/json' : 'application/xml' });
    var a = document.createElement('a');
    var u = URL.createObjectURL(blob);
    a.href = u; a.download = 'data.' + ext;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
  });
})();
</script>

<a class="tb-nav" href="../" title="回到工具台">⌂ 工具台</a>
<style>
.tb-nav{
  position:fixed; left:14px; bottom:14px; z-index:999;
  display:inline-flex; align-items:center; gap:6px;
  padding:8px 13px; border-radius:999px;
  border:1px solid var(--line, #2c3138);
  background:var(--card, var(--panel, #1c1f24));
  color:var(--dim, var(--muted, #9aa1a9));
  font:500 13px/1 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  text-decoration:none; box-shadow:0 2px 12px rgba(0,0,0,.12);
  transition:color .15s, border-color .15s;
}
.tb-nav:hover{ color:var(--accent, #5b8cff); border-color:var(--accent, #5b8cff) }
</style>
</body>
</html>
